schemaVersion: 2
id: dual_issue_demo
version: 0.8.0
displayName: 顺序双发射演示核
description: 一个规模受控、具有明确优化空间的顺序双发射 Chisel 处理器。
defaults:
  projectName: dual_issue_demo
  goal: 构建一个正确、可检查的顺序双发射 baseline，用于受控架构优化演示。
  useCase: 在同一冻结 baseline 上比较 Processor Agent 工作流与直接向 Codex 提需求的结果。
  constraints:
    - baseline 规模需要支持快速迭代和定向验证。
    - 保持程序顺序和顺序退休语义。
    - 暴露周期数、退休指令数、双发射周期数和目标配对数计数器。
  exclusions:
    - 虚拟内存
    - interrupt
    - debug
    - MMIO
    - 完整特权 trap 入口与返回
    - 自动时序闭合
environmentChecks:
  - id: host_node
    description: Windows Node.js 控制端
    runner: host
    command: node
    args:
      - --version
    required: true
  - id: host_codex
    description: Windows Codex CLI Agent Runtime
    runner: host
    command: codex
    args:
      - --version
    required: true
  - id: wsl_java
    description: WSL Java 运行环境
    runner: wsl
    script: java -version
    required: true
  - id: wsl_sbt
    description: WSL SBT 构建工具
    runner: wsl
    script: sbt --script-version
    required: true
  - id: wsl_verilator
    description: WSL Verilator 仿真器
    runner: wsl
    script: verilator --version
    required: true
decisions:
  - id: S1_DEC_001
    topic: ISA Profile
    question: baseline 实现哪个 ISA 子集？
    whyNow: Decoder、架构状态、参考模型、测试和指令编码均依赖此选择。
    blocking: true
    researchPolicy: required
    dependsOn: []
    knownFacts:
      - 当前 WSL 环境没有外部 RISC-V 编译器和 Spike 可执行文件。
      - 本地标量参考模型可以避免第一版 Demo 依赖外部 ISA 工具链。
    recommendation: rv32i
    affectedArtifacts:
      - architecture/overview.md
      - verification/plan.md
    options:
      - id: rv32i
        label: RV32I
        summary: 实现定向测试和 benchmark 所需的完整 RV32I 基础整数指令集。
        consequences:
          - 除访存操作外，执行延迟保持统一。
          - baseline 不引入乘除法器状态。
          - 需要维护一个小型 RV32I 参考模型。
      - id: rv32im
        label: RV32IM
        summary: 在 RV32I 基础上加入整数乘除法指令。
        consequences:
          - 引入多周期执行以及额外 stall 或握手规则。
          - 验证矩阵扩展到目标双发射机制之外。
  - id: S1_DEC_002
    topic: 执行环境
    question: Chisel 构建和仿真在哪个环境运行？
    whyNow: 项目命令、路径转换、环境证据和恢复方式依赖统一的执行边界。
    blocking: true
    researchPolicy: none
    dependsOn: []
    knownFacts:
      - Windows 已安装 Node.js 和已登录的 Codex CLI。
      - WSL 已安装 Java 17、SBT 和 Verilator。
    recommendation: windows_control_wsl_execution
    affectedArtifacts:
      - architecture/overview.md
      - verification/plan.md
    options:
      - id: windows_control_wsl_execution
        label: Windows 控制，WSL 执行
        summary: Processor Agent 和 Codex 在 Windows 运行，Chisel 构建与仿真命令在 WSL 运行。
        consequences:
          - 需要确定性的 Windows 到 WSL 路径转换。
          - 可以直接复用当前已登录的 Codex CLI 和 Linux 硬件工具链。
      - id: wsl_only
        label: 全部在 WSL 运行
        summary: Processor Agent、Codex、构建和仿真全部在 WSL 运行。
        consequences:
          - 需要在 WSL 安装并登录受支持的 Codex CLI。
          - 消除 Windows 控制端与 WSL 执行端之间的边界。
  - id: S1_DEC_003
    topic: 流水线
    question: baseline 采用哪组流水级边界？
    whyNow: Forwarding、冒险检测、分支恢复、模块边界和测试时序均依赖流水级划分。
    blocking: true
    researchPolicy: required
    dependsOn:
      - S1_DEC_001
    knownFacts:
      - 优化演示需要显式观察同周期发射的两条 ALU 指令之间的关系。
    recommendation: five_stage
    affectedArtifacts:
      - architecture/overview.md
    options:
      - id: five_stage
        label: 五级流水线
        summary: 使用 IF、ID/Issue、EX、MEM 和 WB/Retire 五个边界。
        consequences:
          - baseline 结构紧凑且便于检查。
          - 配对和寄存器读取位于同一流水级。
          - baseline 仍禁止 Lane 0 到 Lane 1 的同拍 RAW；若后续 Architecture Change 加入 ALU 旁路，该旁路会形成显式组合路径。
      - id: six_stage_split_issue
        label: 拆分 Decode 与 Issue
        summary: 在 Decode 与 Issue/Register Read 之间增加寄存边界。
        consequences:
          - Decode 和配对逻辑获得更多时序余量。
          - 增加一个流水边界及对应恢复状态。
  - id: S1_DEC_004
    topic: Lane 能力
    question: 两条发射 Lane 分别允许执行哪些操作？
    whyNow: 配对合法性、结构冲突、结果选择和模块端口均依赖 Lane 能力。
    blocking: true
    researchPolicy: conditional
    dependsOn:
      - S1_DEC_003
    knownFacts:
      - Lane 0 始终比 Lane 1 年老。
      - 首个优化目标是 ALU 生产者与消费者配对。
    recommendation: asymmetric
    affectedArtifacts:
      - architecture/overview.md
      - verification/plan.md
    options:
      - id: asymmetric
        label: 非对称 Lane
        summary: Lane 0 接受全部受支持指令，Lane 1 只接受简单整数 ALU 指令。
        consequences:
          - 访存和控制流副作用只由较老的 Lane 0 发起。
          - Lane 1 保持精简，同时保留有价值的双发射机会。
      - id: symmetric_alu_branch
        label: 对称 ALU 与 Branch
        summary: 两条 Lane 均接受 ALU 和控制流指令，访存仍限定在 Lane 0。
        consequences:
          - 需要同拍控制流仲裁和更多恢复场景。
          - 增加与目标优化无关的逻辑。
  - id: S1_DEC_005
    topic: baseline 同拍 RAW
    question: baseline 如何处理 Lane 0 生产、Lane 1 消费的同拍 RAW？
    whyNow: 该规则定义优化空间和第一个 Architecture Change。
    blocking: true
    researchPolicy: conditional
    dependsOn:
      - S1_DEC_004
    knownFacts:
      - 跨周期 forwarding 保持可用。
      - Lane 0 始终比 Lane 1 年老。
    recommendation: prohibit_same_cycle_raw
    affectedArtifacts:
      - architecture/overview.md
      - verification/plan.md
    options:
      - id: prohibit_same_cycle_raw
        label: 禁止同拍 RAW
        summary: Lane 1 读取 Lane 0 写入的非零目的寄存器时，将该指令对串行化。
        consequences:
          - 得到正确且有意保守的 baseline。
          - 为产品对照实验保留一个精确优化目标。
      - id: allow_alu_bypass
        label: baseline 直接加入 ALU 旁路
        summary: 通过 Lane 0 到 Lane 1 的同拍旁路允许符合条件的 ALU RAW 配对。
        consequences:
          - 计划中的首个 Architecture Change 将从 Demo 中消失。
          - baseline 设计阶段就需要闭合同拍旁路契约和时序路径。
  - id: S1_DEC_006
    topic: 访存与控制流
    question: baseline 采用哪些访存和控制流限制？
    whyNow: 结构冲突、flush、backpressure 和外部接口均依赖这些限制。
    blocking: true
    researchPolicy: required
    dependsOn:
      - S1_DEC_003
    knownFacts:
      - baseline 使用参数化阻塞式 ICache 和写回写分配 DCache。
      - 所有外部 AXI 事务全局串行化，任意时刻最多一个事务 outstanding。
    recommendation: single_side_effect_lane
    affectedArtifacts:
      - architecture/overview.md
      - verification/plan.md
    options:
      - id: single_side_effect_lane
        label: 单一副作用 Lane
        summary: 每周期最多一条访存或控制流指令，固定进入 Lane 0，访存接口支持 decoupled backpressure。
        consequences:
          - 外部副作用和 redirect 具有唯一所有者。
          - 延迟访存响应需要显式 stall 规则。
      - id: fixed_latency_memory
        label: 固定延迟访存
        summary: 使用一周期 SRAM 风格响应，全部访存操作进入 Lane 0。
        consequences:
          - 第一版实现更简单。
          - baseline 无法展示通用 backpressure 行为。
  - id: S1_DEC_007
    topic: 异常范围
    question: 第一版 baseline 精确处理哪些异常条件？
    whyNow: Flush、退休、副作用抑制和参考模型均依赖异常边界。
    blocking: true
    researchPolicy: required
    dependsOn:
      - S1_DEC_001
      - S1_DEC_006
    knownFacts:
      - 完整特权架构不属于第一版 Demo。
    recommendation: minimal_precise_stop
    affectedArtifacts:
      - architecture/overview.md
      - verification/plan.md
    options:
      - id: minimal_precise_stop
        label: 精确停止接口
        summary: 检测非法指令和非对齐访问，抑制年轻指令副作用，并向测试 Harness 报告终止 trap 记录。
        consequences:
          - 在不实现特权 trap CSR 的情况下保持精确顺序。
          - 测试可以观察明确的失败契约。
      - id: supported_stream_only
        label: 只接受受支持指令流
        summary: 将不支持的编码和非对齐访问排除在合法输入域之外。
        consequences:
          - baseline 控制逻辑更少。
          - 异常测试程序没有架构响应。
  - id: S1_DEC_008
    topic: 验证策略
    question: 哪种参考模型和 workload 策略作为 baseline 门禁？
    whyNow: Stage2 模块测试、集成完成、计数器和优化对照需要统一验收契约。
    blocking: true
    researchPolicy: required
    dependsOn:
      - S1_DEC_001
      - S1_DEC_005
      - S1_DEC_006
      - S1_DEC_007
    knownFacts:
      - 当前 WSL 没有外部 RISC-V 编译器和 Spike 可执行文件。
    recommendation: embedded_reference
    affectedArtifacts:
      - verification/plan.md
    options:
      - id: embedded_reference
        label: 内置参考模型
        summary: 使用手工编码定向程序、小型标量 ISA 模型和确定性配对 benchmark。
        consequences:
          - Demo 保持自包含和可复现。
          - 项目需要在测试旁维护参考模型。
      - id: external_riscv_tools
        label: 外部 RISC-V 工具
        summary: 安装 RISC-V 编译器和 Spike，并比较架构轨迹。
        consequences:
          - ISA 覆盖和外部验证能力更强。
          - Stage2 前增加安装和版本管理工作。
architecture:
  roles:
    - id: axi_aributer
      responsibility: 连接 ICache 与 DCache，并向 core 提供唯一外部 AXI master。全局串行化 I_REFILL、D_REFILL 和 D_WRITEBACK，任意时刻最多一个外部事务 outstanding。grant 时锁存 owner、transactionKind 和事务描述符；读事务保持到 RLAST 被消费，写事务保持到 B 被消费。返回只路由给登记 owner。redirect、terminal trap 或 reset 后不可取消的事务进入 drain，完成前禁止新 grant，drain 返回不产生 Cache commit 或 CPU completion。
    - id: icache
      responsibility: 实现参数化、可调整的阻塞式 ICache。接受 fetch 的 CPU 请求并最多保存一个 CPU owner；hit 使用寄存完成接口返回，miss 期间拒绝后续 CPU 请求。ICache 拥有 tag、data、valid、replacement、refill buffer 和 stale 状态，通过 AXIAributer 发起 I_REFILL。refill 全部 beat 接收后统一提交整行 data、tag 和 valid，随后才能产生 CPU response。redirect 或 terminal trap 清除旧路径 CPU response；已经取得 AXI owner 的旧事务保持 stale 并 drain 到 RLAST，禁止旧路径 line commit。
    - id: dcache
      responsibility: 实现参数化、可调整的阻塞式写回写分配 DCache。接受 memory 的 M1 CPU 请求并最多保存一个 CPU owner；hit、miss、writeback、refill 或 completion 保持期间拒绝后续 CPU 请求。DCache 拥有 tag、data、valid、dirty、replacement、victim、refill 和 writeback 状态。dirty victim 必须在 D_WRITEBACK 的 AW、全部 W 和 B 完成后才能请求 D_REFILL。refill 全部 beat 进入 buffer 后统一提交整行 data、tag、valid 和 dirty 目标状态，后续观察点才能向 retire 产生 CPU completion。Store 在目标行状态提交完成后的下一体系结构可观察点产生 success completion。
    - id: fetch
      responsibility: 承担 PF/ICache S1 与 IF/ICache S2 的前端流水职责。PF/ICache S1 生成四字节对齐的 ICache CPU 请求并保持 request valid 与 PC 直到接受。IF/ICache S2 接受 ICache CPU response，形成两条顺序 Lane，并在 ID hold 时保存单组 response buffer。fetch 消费 decode 的 IF/ID 接受条件和 control 的 redirect、hold、kill、trap、reset 结果；redirect target 只有在旧 ICache CPU owner 与 stale drain 均结束后才能启动。
    - id: decode
      responsibility: 承担 ID。IF/ID 边界寄存两条 Lane 的 valid、PC 和 instruction。ID 组合译码受支持 RV32I，生成 decoded_control 与 Decode exception。Decode 将本拍零、一或两条有效指令作为有序组提交给 Instruction Queue；只有完整有效组被接受时才释放对应 IF/ID 状态。
    - id: instruction_queue
      responsibility: 唯一拥有 ID 与 Issue/RR 之间的 Instruction Queue。容量参数 instructionQueueEntries 默认 8，必须为正偶数，允许非二次幂容量并显式回绕 head 和 tail。每个 entry 保存 valid、PC、instruction、decoded_control 和 exception，FIFO 顺序表示程序年龄。每拍最多原子接受两条并释放两条；入队许可只使用拍初空闲容量，同拍出队 entry 从下一拍开始复用。
    - id: regfile
      responsibility: 维护 RV32I 架构整数寄存器。regfile 消费 issue 的两组读地址并提供组合读数据，消费 retire 的最多两个有序写回和 retire_forwarding。x0 读出恒为零且写入被忽略。
    - id: issue
      responsibility: 承担 Issue/RR。读取 Instruction Queue 最老两条候选，组合检查 Lane 能力、程序年龄、结构限制、同拍 RAW、WAW 和跨周期依赖，向 regfile 发出读地址并选择 EX、M1 与 M2/Retire forwarding。双发射提交 dequeue 2，串行化提交 dequeue 1，阻塞提交 dequeue 0。接受的 payload 在 Issue/RR 到 EX 边界寄存。
    - id: execute
      responsibility: 承担 EX。组合执行最多两条 Lane 的 ALU、控制流和有效地址计算，产生 ALU result、redirect candidate、m1_memory_metadata 与 EX exception。合法 redirect 首次接受时设置 ex_redirect_applied，EX hold 时禁止重复 redirect。结果与完整 Lane payload 在 EX 到 M1 边界寄存。
    - id: memory
      responsibility: 承担公共 M1。memory 保存 M1 Lane 组以及 DCache 接受前的 m1_memory_metadata 和 m1_dcache_request_valid，向 DCache 驱动唯一 CPU request。请求等待 ready 时保持 Lane payload、metadata 和全部 request 字段。request.fire 在同一边界把 Lane 组移交 M2/Retire，并由 DCache 捕获为 dcache_cpu_request_owner 与 dcache_cpu_request_metadata。memory 不拥有 DCache hit、miss、victim、refill、writeback 或 AXI 状态。
    - id: retire
      responsibility: 承担 M2/Retire。retire 保存有序 Lane 组，等待 DCache CPU completion，完成 Load 字节选择、对齐、扩展和寄存器写回，或确认 Store 行状态提交完成。retire 产生有序 writeback、store_visible_event、commit_trace、terminal_trap 和 performance_counters。Store success completion、store_visible_event、Lane 0 commit 和 retirement 在同一边界发生且仅一次。
    - id: control
      responsibility: 集中仲裁 reset、terminal trap、M2/Retire 正常退休、DCache CPU completion、Execute redirect、ICache response 或 stale drain、Cache CPU request、Instruction Queue 事件、backpressure 和正常推进。control 按资源和程序年龄输出 fire、hold 与 kill，不拥有流水 payload、Cache CPU owner、Cache 存储状态或 AXI 事务状态。
    - id: core
      responsibility: 集成 fetch、ICache、decode、Instruction Queue、regfile、issue、execute、memory、DCache、retire、control 和 AXIAributer。对外只暴露一组 AXI master、reset、commit_trace、store_visible_event、terminal_trap 和 performance_counters。core 不复制流水 payload、Cache CPU owner、AXI owner 或退休状态。Architecture Role 到 Stage2 Implementation Unit 的映射由 Stage2 Topology Decision 决定。
  systemBoundary:
    - baseline 包含参数化阻塞式 ICache、写回写分配 DCache 和共享 AXIAributer；项目排除虚拟内存、interrupt、debug、MMIO、完整特权 trap 入口与返回和自动时序闭合。
    - 使用单一高有效同步 reset，reset 释放后从 0x80000000 开始取指。
    - 地址和数据均为 32 位小端模型。
    - baseline 实现参数化、可调整的阻塞式 ICache 和 DCache。每个 Cache 的 CPU 侧最多保存一个在途请求，Cache miss 期间拒绝并停止响应后续 CPU 请求。
    - ICache 向 fetch 提供取指 CPU 请求与响应；DCache 向 memory 和 retire 提供 Load、Store 与 FENCE 所需的 CPU 请求、completion 和反压接口。顶层不暴露直连 instruction_memory 或 data_memory 接口。
    - DCache 采用写回、写分配。取指、Load 和 Store 均不早启动或早返回，refill 完整接收后统一提交整行 data、tag、valid 及 DCache dirty 目标状态，随后才能产生 CPU response。
    - 可缓存 Store 在目标 DCache 行的 data、tag、valid、dirty 完成提交后的下一个体系结构可观察点产生 store_visible_event、commit 和 retirement。后续替换触发的 dirty victim writeback 及其 AXI B 不阻塞或撤销该 Store 的退休。
    - ICache 和 DCache 连接同一个 AXIAributer。AXIAributer 统一拥有 global busy、owner、transactionKind 和 drain，所有外部 AXI 事务全局串行化，任意时刻最多一个事务 outstanding。
    - 顶层对外只暴露一组 AXI4 master 的 AR、R、AW、W、B 通道。读事务持续到 RLAST 被消费，写事务持续到 B 被消费，返回只路由给已登记 owner。
    - AXI rresp 和 bresp 只允许正常响应。baseline 不实现 AXI access fault、错误异常映射、错误恢复状态或错误 Cache line 回滚。
    - 向 verification_harness 暴露 commit_trace、store_visible_event、terminal_trap 和 performance_counters。
  supportedInstructions:
    - RV32I 高位立即数指令：LUI、AUIPC。
    - RV32I 跳转指令：JAL、JALR。
    - RV32I 分支指令：BEQ、BNE、BLT、BGE、BLTU、BGEU。
    - RV32I Load 指令：LB、LH、LW、LBU、LHU。
    - RV32I Store 指令：SB、SH、SW。
    - RV32I 立即数 ALU 指令：ADDI、SLTI、SLTIU、XORI、ORI、ANDI、SLLI、SRLI、SRAI。
    - RV32I 寄存器 ALU 指令：ADD、SUB、SLL、SLT、SLTU、XOR、SRL、SRA、OR、AND。
    - FENCE 串行化简单数据存储器接口；ECALL 和 EBREAK 向 Harness 报告终止 trap。
  invariants:
    - 每个被接受的指令对中，Lane 0 始终比 Lane 1 年老。
    - 架构退休保持程序顺序，每周期最多退休两条指令。
    - 较老指令报告 terminal trap 后，faulting 指令和全部年轻指令不能提交。
    - x0 在受支持 RISC-V Profile 中始终为零。
    - DCache CPU request acceptance、DCache CPU completion、store_visible_event 和 redirect_event 四个资源域分别实行唯一所有者；每个资源域每周期最多提交一个事件。不同资源域之间允许按程序年龄和资源独立性同拍提交。
    - 每周期最多一个 DCache CPU request.fire。其所有者只能是合法、对齐且程序年龄正确的 M1 Lane 0；dcache_cpu_request_owner 有效、DCache FSM 活跃或 completion 未消费时禁止新的 request.fire。
    - DCache CPU request.fire 在周期边界设置 dcache_cpu_request_owner 并捕获 dcache_cpu_request_metadata。owner 与 metadata 保持到匹配的 DCache CPU completion.fire 或 reset；清除后的状态从下一周期开始复用。
    - 每周期最多一个 DCache CPU completion.fire。completion 的 owner 必须匹配唯一 dcache_cpu_request_owner 和对应 M2/Retire Lane 0；没有 owner 时 completion.ready 必须为零。
    - 每周期最多一个 store_visible_event。其所有者必须与同拍 DCache Store success completion.fire 和 Lane 0 Store commit 相同；缺少其中任一事件属于禁止组合。
    - 每周期最多一个 redirect_event。其所有者只能是合法、无 exception 且 redirect_applied 为零的 Execute Lane 0。
    - Lane 1 不得拥有 DCache CPU request、DCache CPU completion、store_visible_event、redirect_event、FENCE 或 terminal_trap 副作用。
    - 较老 M1 DCache CPU request.fire 可以与年轻 Execute redirect_event 同拍提交；DCache owner 必须比 redirect owner 年老，redirect kill 不得覆盖该较老 owner。
    - 较老 Load 或 Store DCache CPU completion.fire 可以与年轻 Execute redirect_event 同拍提交；Load 写回、Store visible、commit 和 retirement先满足较老事件语义，redirect 只清除自身之后的年轻状态。
    - 同一个 DCache CPU owner 的 request.fire 与 completion.fire 禁止同拍；completion.fire 清除的 owner、metadata、completion valid 和 M2/Retire 槽从下一周期开始复用。
    - DCache owner 比同拍 redirect owner 年轻时禁止两者共同提交；七级流水顺序必须保证允许并发的 M1 或 M2/Retire owner年老于 Execute redirect owner。
    - terminal_trap 报告前不得存在未完成的更老 dcache_cpu_request_owner。terminal_trap 阻止新的 Fetch、ICache 和 DCache CPU request，并清除年轻流水和未接受的 CPU request。
    - AXIAributer 任意时刻最多一个 AXI owner。axi_busy 有效期间 owner、transactionKind、transaction descriptor 和 beatCount 保持稳定；读事务保持到 RLAST 被消费，写事务保持到 B 被消费。
    - AXI rresp 和 bresp 只允许正常响应，不产生 cause 5、cause 7、AXI access fault、错误恢复状态或错误 Cache line 回滚。
    - redirect stale drain、reset drain 和 terminal trap drain 保留已握手事务的 AXI owner、transactionKind 和剩余 beat 状态到 RLAST 或 B；drain 不产生 Cache line commit、Cache CPU response或 completion、commit、retirement或store_visible_event。
    - AXI 事务终结边界不复用 owner 或接受新 grant；owner、transactionKind、beatCount 和通道状态从下一周期开始复用。
    - refill line valid 只能在完整 Cache line 的全部 beat 接收并统一提交 data、tag、valid 和目标 dirty 状态后设置；CPU response 或 completion 最早在后续体系结构可观察点产生。
    - Store 只在目标 DCache 行状态提交后的 success completion 边界产生 store_visible_event、commit 和 retirement；后续 dirty victim writeback 及其 AXI B 不阻塞或撤销该已退休 Store。
  sharedFields:
    - name: valid
      semantics: 当前 Lane 保存一条活跃指令，其 payload 字段可以被消费。
      producer: fetch 和各 Architecture Role 对应的流水边界
      consumers:
        - decode
        - instruction_queue
        - issue
        - execute
        - memory
        - retire
        - control
      validFrom: ICache CPU response.fire 将指令与 request PC 写入 IF response buffer 的周期边界
      validUntil: 退休、redirect kill、terminal trap kill 或 reset
    - name: pc
      semantics: 当前 Lane 对应指令的 32 bit 字节地址。
      producer: fetch
      consumers:
        - decode
        - instruction_queue
        - issue
        - execute
        - retire
        - commit_trace
        - terminal_trap
        - store_visible_event
      validFrom: ICache CPU response.fire 将 request PC 写入 IF response buffer 的周期边界
      validUntil: 退休或 kill
    - name: instruction
      semantics: 用于 Decode、commit trace 和 terminal trap 比较的原始 32 bit RV32I 编码。
      producer: fetch
      consumers:
        - decode
        - instruction_queue
        - issue
        - retire
        - commit_trace
        - terminal_trap
        - store_visible_event
      validFrom: ICache CPU response.fire 将指令写入 IF response buffer 的周期边界
      validUntil: 退休或 kill
    - name: lane_age
      semantics: 同一发射周期中 Lane 0 比 Lane 1 年老。
      producer: issue
      consumers:
        - execute
        - memory
        - retire
        - control
      validFrom: Issue/RR 接受
      validUntil: 退休或 kill
    - name: decoded_control
      semantics: 操作类型、源寄存器使用标记、立即数、目的寄存器、写使能、访存宽度和符号属性。
      producer: decode
      consumers:
        - instruction_queue
        - issue
        - execute
        - memory
        - retire
      validFrom: Decode 成功
      validUntil: 退休或 kill
    - name: operands
      semantics: 完成跨周期 forwarding 后送入 EX 的寄存器或立即数操作数。
      producer: issue 和 regfile
      consumers:
        - execute
      validFrom: Issue/RR 接受
      validUntil: EX 消费或 kill
    - name: result
      semantics: 供 M2/Retire 选择的 ALU 结果、分支目标、有效地址或 Load 最终返回值；ALU 结果由 execute 产生，Load 最终结果由 retire 在 DCache CPU success completion.fire 时产生。
      producer: execute 或 retire
      consumers:
        - memory
        - retire
        - regfile
        - commit_trace
      validFrom: ALU 或控制流结果完成，或对应 Load 的 DCache CPU success completion.fire
      validUntil: 退休或 kill
    - name: memory_metadata
      semantics: Lane 0 访存类型、宽度、符号属性、32 bit 地址、地址低位、4 bit byte mask、32 bit Store 数据和 Lane 所有权。
      producer: execute
      consumers:
        - memory
        - dcache
        - retire
        - control
        - store_visible_event
      validFrom: EX 有效地址计算完成并写入 EX 到 M1 边界；DCache 在 CPU request.fire 时捕获副本
      validUntil: 对应 DCache CPU completion.fire、terminal trap kill 或 reset
    - name: exception
      semantics: 精确 terminal trap 的 valid、32 bit cause、32 bit faulting PC、32 bit instruction、badAddressValid 和 32 bit badAddress。Decode 只产生 cause 2、3、11；Execute 只产生 cause 0、4、6。baseline 不从 DCache、AXI rresp 或 AXI bresp 产生异常。cause 0、4、6 的 badAddressValid 为一并报告最终错误地址；cause 2、3、11 的 badAddressValid 为零且 badAddress 为零。
      producer: decode 或 execute
      consumers:
        - instruction_queue
        - issue
        - execute
        - memory
        - retire
        - control
        - terminal_trap
      validFrom: Decode 检测 illegal instruction、ECALL 或 EBREAK，或 Execute 检测已采用控制流最终目标、Load 地址或 Store 地址非对齐，并写入对应流水寄存边界
      validUntil: 最老 faulting 指令在 M2/Retire 报告 terminal_trap、被更老 redirect 或 trap kill，或 reset
    - name: redirect
      semantics: 较老 EX Lane 0 控制流指令解析出的 valid 和 32 bit target PC；redirect_applied 保证每条指令最多产生一次 redirect_event。
      producer: execute
      consumers:
        - control
        - fetch
        - icache
        - 年轻流水状态
      validFrom: EX 解析出合法且对齐的 taken branch、JAL 或 JALR
      validUntil: redirect_event 被接受或指令被 kill
    - name: commit_trace
      semantics: 面向 verification_harness 的无 backpressure 双 Lane 退休脉冲。每个 Lane 包含 valid 1 bit、pc 32 bit、instruction 32 bit、rd 5 bit、rdWrite 1 bit 和 rdData 32 bit。valid 为零时同 Lane 其他字段必须为零。Store、FENCE 和其他无寄存器写回的正常退休指令仍产生 valid，其中 rdWrite、rd 和 rdData 均为零。同拍程序顺序固定为 Lane 0 后 Lane 1。faulting 指令和被 kill 指令不产生 commit。
      producer: retire
      consumers:
        - verification_harness
      validFrom: M2/Retire 正常退休事件成立的周期
      validUntil: 当前周期采样结束
    - name: store_visible_event
      semantics: 面向 verification_harness 的无 backpressure单事件脉冲，每周期最多一个。字段包含 valid 1 bit、pc 32 bit、instruction 32 bit、address 32 bit、byteMask 4 bit 和 writeData 32 bit。address 是有效字节地址，byteMask 对应所在对齐 32 bit word 的 byte lane，writeData 是按 byteMask 对齐后的数据。只在同一 Store 的 DCache data、tag、valid 和 dirty 状态已经完成提交，并由 DCache CPU success completion.fire 使该 Store 在 M2/Retire 正常退休时产生；DCache CPU request.fire、Cache miss、refill beat、dirty victim writeback、AXI B 和 drain 均不产生该事件。
      producer: retire
      consumers:
        - verification_harness
      validFrom: 对应 Store 的 DCache CPU success completion.fire 与 Lane 0 commit 同拍成立
      validUntil: 当前周期采样结束
    - name: terminal_trap
      semantics: 面向 control 和 verification_harness 的终止状态。字段包含 valid 1 bit、cause 32 bit、pc 32 bit、instruction 32 bit、badAddressValid 1 bit 和 badAddress 32 bit。cause 仅允许 0 instruction address misaligned、2 illegal instruction、3 EBREAK、4 Load address misaligned、6 Store address misaligned、11 ECALL。cause 0、4、6 将 badAddressValid 置一并报告最终错误地址；cause 2、3、11 将 badAddressValid 与 badAddress 置零。valid 首次置位后全部字段保持到 reset。首次 terminal trap 阻止新的 Fetch、ICache 和 DCache CPU request，清除年轻流水状态与尚未被 Cache 接受的 CPU request；该边界不得存在未完成的更老 DCache CPU owner。已握手的年轻 ICache AXI 事务进入 stale drain，AXIAributer 保持 owner、transactionKind 和 beatCount 直到 RLAST 或 B 被消费。drain response 不产生 Cache line commit、Cache CPU completion、commit_trace、retirement 或 store_visible_event。首次 terminal trap 后禁止新的 commit_trace、store_visible_event 和 performance_counters 更新。
      producer: retire
      consumers:
        - control
        - fetch
        - icache
        - dcache
        - axi_aributer
        - verification_harness
      validFrom: M2/Retire 在不存在未完成的更老 DCache CPU owner时，于周期边界报告最老 faulting Lane 0
      validUntil: reset
    - name: performance_counters
      semantics: 面向 verification_harness 的四个 64 bit 状态字段：cycles、retired_instructions、dual_issue_cycles 和 target_raw_pairs。首次 terminal trap 报告周期完成规定更新，随后四个字段保持到 reset。
      producer: retire
      consumers:
        - verification_harness
      validFrom: reset 释放后的第一个计数周期
      validUntil: reset；首次 terminal trap 后停止更新
    - name: cache_axi_transaction_descriptor
      semantics: "Cache 到 AXIAributer 的 valid、ready transaction request。字段为 transactionKind 2 bit，编码 0=I_REFILL、1=D_REFILL、2=D_WRITEBACK、3=reserved；baseAddress 32 bit，必须按 lineBytes 对齐；beatsMinus1 8 bit，值为 lineBytes/4-1；size 3 bit 固定为 2，表示每 beat 4 bytes；burst 2 bit 固定为 1，表示 INCR；writeLineData 为 lineBytes*8 bit，仅 D_WRITEBACK 有效。axiDataBits 固定为 32，lineBytes 必须是 4 的倍数且 lineBytes/4 位于 1 到 256。owner 由提出 request 的 ICache 或 DCache 端口确定。D_WRITEBACK 的每个 W beat 从 writeLineData[beatCount*32 +: 32] 选择，little-endian 地址每 beat 增加 4。descriptor.valid 等待 ready 时全部 payload 保持稳定。"
      producer: icache 或 dcache
      consumers:
        - axi_aributer
        - verification_harness
      validFrom: Cache miss FSM 完成 kind、line-aligned baseAddress、长度和 writeback line 的寄存捕获后
      validUntil: transaction request.fire；等待 AXIAributer ready 时 payload 保持稳定。Execute redirect 或 terminal trap 只可在 request.fire 前取消年轻旧路径 I_REFILL descriptor；不得取消 D_REFILL 或 D_WRITEBACK。合法 terminal trap 报告边界不存在 DCache CPU owner 或 DCache descriptor。reset 可在 request.fire 前取消任意 descriptor；request.fire 后由 AXIAributer owner 与通道状态处理
    - name: axi_ar
      semantics: 顶层 AXI4 read-address channel。字段为 arvalid 1 bit、arready 1 bit、arid 4 bit 固定为 0、araddr 32 bit、arlen 8 bit、arsize 3 bit 固定为 2、arburst 2 bit 固定为 1。araddr 等于 descriptor.baseAddress，arlen 等于 descriptor.beatsMinus1。baseline 不暴露 ARLOCK、ARCACHE、ARPROT、ARQOS、ARREGION 或 ARUSER；平台 wrapper 如需要这些 sideband 必须绑定常量且不得改变本契约。arvalid 为一后必须保持为一到 AR.fire，等待 arready 时 arid、araddr、arlen、arsize 和 arburst 保持稳定。Execute redirect 只把年轻旧路径 I_REFILL 标记 stale；若 arvalid 已为一则仍完成 AR.fire并 drain 到 RLAST。D_REFILL 无论 arvalid 是否已置一均不受年轻 redirect 取消。
      producer: axi_aributer
      consumers:
        - core
        - external_axi_slave
        - verification_harness
      validFrom: AXIAributer grant I_REFILL 或 D_REFILL 并锁存 descriptor 后
      validUntil: AR.fire。arvalid 尚未置一时，reset 可取消 I_REFILL 或 D_REFILL，Execute redirect 或 terminal trap只可取消年轻旧路径 I_REFILL。arvalid 已置一后，reset、redirect 或 terminal trap均不得撤回 valid或修改 payload，事务在 AR.fire 后按 owner 与 transactionKind 正常完成或 stale drain。合法 terminal trap 报告边界不得存在 D_REFILL candidate；若存在则触发架构断言并禁止 trap 报告
    - name: axi_r
      semantics: "顶层 AXI4 read-data channel。字段为 rvalid 1 bit、rready 1 bit、rid 4 bit 必须为 0、rdata 32 bit、rresp 2 bit 只允许 0=OKAY、rlast 1 bit。第 i 个被接受 beat 写入 refillBuffer[i*32 +: 32]，little-endian。AXIAributer 的 zero-based beatCount 在 R.fire 后增加；rlast 当且仅当 beatCount 等于 arlen。提前、缺失或迟到 rlast、非零 rid 或非 OKAY rresp 属于验证环境协议违例，不产生架构异常或恢复路径。rvalid 为一且 rready 为零时，rid、rdata、rresp 和 rlast 必须保持稳定。"
      producer: external_axi_slave
      consumers:
        - axi_aributer
        - icache
        - dcache
        - verification_harness
      validFrom: 已握手读事务的返回 beat 由外部 slave 拉高 rvalid
      validUntil: 对应 R.fire；最后一个 beat 在 RLAST.fire 完成读事务，owner 和 beatCount 从下一周期复用
    - name: axi_aw
      semantics: 顶层 AXI4 write-address channel，仅 D_WRITEBACK 使用。字段为 awvalid 1 bit、awready 1 bit、awid 4 bit 固定为 0、awaddr 32 bit、awlen 8 bit、awsize 3 bit 固定为 2、awburst 2 bit 固定为 1。awaddr 等于 dirty victim line address，awlen 等于 descriptor.beatsMinus1。baseline 不暴露 AWLOCK、AWCACHE、AWPROT、AWQOS、AWREGION 或 AWUSER；平台 wrapper 如需要这些 sideband 必须绑定常量。awvalid 为一后必须保持为一到 AW.fire，等待 awready 时全部 AW payload 保持稳定。Execute redirect 不取消较老 D_WRITEBACK。
      producer: axi_aributer
      consumers:
        - core
        - external_axi_slave
        - verification_harness
      validFrom: AXIAributer grant D_WRITEBACK 并锁存 descriptor 后
      validUntil: AW.fire。awvalid 尚未置一时 reset 可取消 D_WRITEBACK；awvalid 已置一后 reset 不得撤回 valid，AW、全部 W 与 B按 drain 生命周期完成。Execute redirect 在任何阶段均不取消 D_WRITEBACK。合法 terminal trap 报告边界不得存在 DCache CPU owner、D_WRITEBACK descriptor 或 awvalid；若存在则触发架构断言并禁止 trap 报告
    - name: axi_w
      semantics: "顶层 AXI4 write-data channel。字段为 wvalid 1 bit、wready 1 bit、wdata 32 bit、wstrb 4 bit 固定为 15、wlast 1 bit。AXI4 baseline 不使用 WID。第 i 个 beat 的 wdata 为 writeLineData[i*32 +: 32]，对应地址为 awaddr+i*4。zero-based beatCount 在 W.fire 后增加；wlast 当且仅当 beatCount 等于 awlen。AW.fire 之前不得发送 W beat。wvalid 为一且 wready 为零时 wdata、wstrb 和 wlast 保持稳定；只有当前 W.fire 后才能选择下一 beat。"
      producer: axi_aributer
      consumers:
        - core
        - external_axi_slave
        - verification_harness
      validFrom: D_WRITEBACK 的 AW.fire 完成且当前 write beat 可用
      validUntil: 当前 W.fire；WLAST.fire 后停止 W channel 并等待 B
    - name: axi_b
      semantics: 顶层 AXI4 write-response channel。字段为 bvalid 1 bit、bready 1 bit、bid 4 bit 必须为 0、bresp 2 bit 只允许 0=OKAY。非零 bid 或非 OKAY bresp 属于验证环境协议违例，不产生 cause 7、Cache line 回滚或错误恢复。bvalid 为一且 bready 为零时 bid 和 bresp 保持稳定。D_WRITEBACK 只有在全部 W beat 完成并消费 B 后终结，DCache 才能提出后续 D_REFILL。
      producer: external_axi_slave
      consumers:
        - axi_aributer
        - dcache
        - verification_harness
      validFrom: 外部 slave 在已接受全部 write beat 后拉高 bvalid
      validUntil: B.fire 完成写事务，owner、transactionKind 和通道状态从下一周期复用
  globalProtocols:
    - id: control_priority
      ownerRole: control
      producerRoles:
        - control
      consumerRoles:
        - fetch
        - icache
        - decode
        - instruction_queue
        - issue
        - execute
        - memory
        - dcache
        - retire
        - axi_aributer
      affectedResources:
        - reset
        - terminal_trap
        - retirement
        - redirect
        - cache_handshake
      rules:
        - Control 使用按资源集中表达的同拍事件矩阵。架构副作用资源依次处理 reset、最老 terminal trap、较老 DCache CPU completion 与正常 M2/Retire 退休、Execute redirect、ICache CPU response 或 stale drain、Cache CPU request 接受、Instruction Queue 普通事件、hold。
        - 程序年龄更老且作用资源独立的事件允许同拍提交。较老 DCache CPU completion 或较老 M1 request.fire 可以与年轻 Execute redirect 同拍；redirect kill 不得覆盖这些较老事件。
        - reset 抑制同拍 Cache commit、CPU completion、retire、redirect、Instruction Queue 入出队、Cache transaction grant和全部架构副作用。reset 边界仍采样已经由总线 valid 与 ready 形成的 AR.fire、AW.fire、W.fire、R.fire或 B.fire，已断言 ARVALID、AWVALID 或已发生任一外部握手的事务设置 drain并保留 AXI owner、transactionKind、descriptor、beatCount和通道状态。
        - AXIAributer 资源优先级为 reset 标记取消或 drain、同拍外部 handshake 记账、当前事务终结、当前 beat推进、新事务 grant。reset 与 AR.fire 或 AW.fire 同拍时该 handshake 有效，事务进入 drain；事务终结与新 grant 不在同一周期边界复用 owner。
        - 每个 redirect、Cache CPU completion、Cache CPU request acceptance、retire、enqueue 和 dequeue 事件在一个周期边界最多提交一次。
    - id: memory_stage_events
      ownerRole: memory
      producerRoles:
        - memory
      consumerRoles:
        - retire
        - control
      affectedResources:
        - dcache_cpu_request
        - dcache_cpu_completion
        - store_visible_event
        - redirect_event
      rules:
        - EX 组合计算 Lane 0 访存的有效地址、访问类型、宽度、符号属性、byte mask 和 Store 数据，并检查自然对齐；结果与完整 Lane payload 在 EX 到 M1 边界寄存。地址非对齐时 EX 设置 exception，M1 不得产生 DCache CPU request。
        - 公共 M1 使用已寄存的 m1_memory_metadata 驱动唯一 DCache CPU request。request valid、地址、访问类型、byte mask 和 Store 数据在 request.fire 前保持稳定。
        - request.fire 只在 M2/Retire 能接受该组且同拍全部较老 M2/Retire 指令正常退休时发生。Store 还要求全部较老指令已经正常退休或在该边界正常退休。
        - request.fire 同拍将 M1 Lane 组移交 M2/Retire，并由 DCache 捕获 dcache_cpu_request_owner 与 dcache_cpu_request_metadata。request.fire 不产生 Load forwarding、Store visible、commit 或 retirement。
        - M2/Retire 保存访存 Lane 0 和同组 Lane 1，等待 DCache CPU completion。Load completion 同拍产生最终 result、非 x0 写回、forwarding、commit 和 Lane 0 retirement。Store success completion 同拍产生 store_visible_event、commit 和 Lane 0 retirement。
        - 非访存指令组按 EX、M1、M2/Retire 顺序推进并在 M2/Retire 写回和顺序退休。正式整核流水名称保持 EX、M1 和 M2/Retire。
    - id: dcache_cpu_request_lifecycle
      ownerRole: dcache
      producerRoles:
        - dcache
      consumerRoles:
        - memory
        - retire
        - control
      affectedResources:
        - dcache_cpu_owner
        - dcache_cpu_request_metadata
      rules:
        - DCache 仅在没有 CPU owner、没有未消费 completion 且状态机允许接受时拉高 CPU request ready。request.fire 设置唯一 dcache_cpu_request_owner 并捕获 dcache_cpu_request_metadata。
        - CPU owner 有效期间拒绝所有后续 CPU request。owner、metadata 和对应 M2/Retire Lane 组保持到 CPU completion.fire 或 reset。
        - Load hit 在 Cache 读结果完成后形成寄存 CPU completion；Store hit 先在 Cache 存储写边界提交 data、tag、valid 和 dirty，后续体系结构可观察点才形成 success completion。
        - completion.ready 只在 owner 有效、对应 M2/Retire Lane 0 有效且本拍允许顺序完成时置位。没有 owner 时 completion.ready 为零。
        - completion.fire 清除 CPU owner、metadata 和 completion valid；这些状态及 M2/Retire 存储槽从下一周期开始复用。
        - 年轻 Execute redirect 不取消已接受的较老 DCache CPU owner。terminal trap 报告前必须不存在未决的更老 DCache CPU owner。
        - reset 清除 DCache CPU owner、metadata 和 completion valid并抑制 Cache commit；已握手外部 AXI 事务由 AXIAributer drain。
    - id: dcache_miss_line_commit
      ownerRole: dcache
      producerRoles:
        - dcache
      consumerRoles:
        - memory
        - retire
        - control
      affectedResources:
        - dcache_line
        - victim
        - refill_buffer
        - dirty_state
      rules:
        - DCache miss 选择 victim 时固定 victim index、way、tag、整行 data、valid 和 dirty，并在 miss 生命周期内保持。
        - valid 且 dirty victim 必须先发起 D_WRITEBACK。AW 握手后才允许 W 通道推进，全部 W beat 完成并消费 B 后，DCache 才能发起 D_REFILL。clean 或 invalid victim 可以直接发起 D_REFILL。
        - D_REFILL 的每个 R beat 写入 refill buffer。RLAST 被消费只表示整行传输结束，不直接产生 CPU completion。
        - 完整 refill line 在独立 Cache 存储提交边界统一写入 data、tag、valid 和目标 dirty。CPU completion 最早在该提交后的下一体系结构可观察点产生。
        - 取指、Load 和 Store 均不使用 partial refill hit、critical-word-first、early restart 或 beat 级早返回。
        - DCache 存储写口按 reset 或 invalidate、完整 refill commit、Store hit commit、hold 仲裁。阻塞式单 CPU owner 保证完整 refill commit 与 Store hit commit 不得同拍，并由断言检查。
        - Store retirement 后由后续替换触发的 dirty victim writeback 和 AXI B 不属于该已退休 Store 的完成条件，也不撤销 store_visible_event。
    - id: instruction_fetch_ownership
      ownerRole: fetch
      producerRoles:
        - fetch
      consumerRoles:
        - decode
        - control
      affectedResources:
        - fetch_pc
        - icache_cpu_owner
        - if_response_buffer
      rules:
        - Fetch 最多保持一个尚未被 ICache 接受的 PF/ICache S1 CPU request，并保持 request PC 到 request.fire、redirect kill、terminal trap kill 或 reset。
        - ICache CPU response 只返回 request PC 所在 Cache line 内的指令字。request PC 四字节对齐且指向 lineBytes-4 时，Lane 0 valid 为一并取当前行最后一个 word，Lane 1 valid 为零且 instruction payload 置零；其他合法 request PC 的 Lane 0 和 Lane 1 均有效，PC 分别为 request PC 和 request PC 加 4。
        - 正常 response.fire 在周期边界把同一 Cache line 的一个或两个有效 Lane 和 request PC 写入 IF response buffer。双 Lane response 将顺序 fetch PC 更新为 request PC 加 8；行末单 Lane response 将顺序 fetch PC 更新为 request PC 加 4。Fetch 不保存跨行半组，不组合两次 ICache response，也不从未请求的下一行形成 Lane 1。
        - 行末单 Lane response 被 IF response buffer 接受后，下一行首地址作为普通 PF/ICache S1 request。该 request 只有在旧 ICache CPU owner 与 response valid 于上一边界清除后才能从下一周期参与 request.fire；第二行 hit、miss、refill、response hold 和 owner 释放均使用普通阻塞式 ICache 生命周期。
        - IF response buffer 拍初为空时可以接受 response；拍初已满时 response.ready 为零，同拍移交 ID 产生的空位从下一拍开始接收新 response。下游 hold 时保持 buffer valid、Lane valid、PC 和 instruction，直到 ID 原子接受当前一个或两个有效 Lane或高优先级 kill。
        - Decode 与 Instruction Queue 按 Lane valid 接受单 Lane 或双 Lane 有序组。行末 Lane 0 一旦被接受即只出现一次；下一行首指令只由后续普通 ICache response 产生，保证跨行顺序取指无丢失、无重复。
        - redirect 优先于同拍 ICache response 和顺序 PC 更新，保存 target PC并清除旧路径 PF request 与 IF response buffer。若跨行下一行 request 尚未被 ICache 接受则直接取消；已被 ICache 接受时按旧路径 owner 和 stale drain 规则处理。新目标 request 只有在旧 ICache CPU owner、stale 与 AXI drain 均结束后才能启动。
        - terminal trap 清除跨行普通 PF request 和 IF response buffer并禁止新取指；已被 ICache 接受的下一行 request 使用 stale drain。reset 清除全部 Fetch CPU 侧状态；已发生外部 AXI 握手的下一行事务由 AXIAributer drain。
        - Stage2 定向验证必须覆盖 request PC 等于 lineBytes-4 时的当前行 hit、下一行 hit、下一行 miss与完整 refill、IF response backpressure、第二个 request 等待期间 redirect、terminal trap、reset及已握手 I_REFILL stale drain，并检查 Lane valid、PC 序列、无丢失和无重复。
    - id: icache_request_lifecycle
      ownerRole: icache
      producerRoles:
        - icache
      consumerRoles:
        - fetch
        - decode
        - control
      affectedResources:
        - icache_cpu_owner
        - icache_line
        - stale_drain
      rules:
        - ICache 仅在没有 CPU owner、没有未消费 response 且状态机允许接受时拉高 CPU request ready。request.fire 捕获唯一 CPU owner 与 request PC。
        - CPU owner 有效期间拒绝后续 Fetch request。hit 完成或完整 refill line 提交后形成寄存 CPU response，response.fire 后 owner 与 response valid 在边界清除并从下一周期复用。
        - 每个 CPU owner 只访问 request PC 所在的一条 Cache line。response Lane 0 返回 request PC 对应 word；request PC 位于 lineBytes-4 时 Lane 1 valid 为零且 payload 置零，其余位置 Lane 1 返回同一行 request PC 加 4 对应 word。ICache 不发起隐式第二行访问，不保存跨行拼接状态。
        - miss 通过 AXIAributer 发起 I_REFILL。全部 R beat 进入 refill buffer 并消费 RLAST 后，整行 data、tag 和 valid 在独立边界提交，后续观察点才能形成当前 owner 的 CPU response。行末单 Lane 也禁止 partial refill hit、critical-word-first、early restart 和 beat 级早返回。
        - redirect 将旧路径 CPU owner 标记 stale 并清除正常 response。若 I_REFILL 尚未取得 AXI grant，可以取消本地请求；已经取得 owner 的事务保持 stale 并 drain 到 RLAST，全部数据丢弃且不得提交 line。
        - redirect 与旧 ICache R beat 同拍时先登记 stale，再按 stale drain 消费该 beat；若该 beat 是 RLAST，则同拍完成 drain，新目标取指最早下一周期参与。
        - redirect 与旧路径 refill commit 候选同拍时，redirect kill 阻止旧路径 line valid 提交。terminal trap 使用相同 stale drain 规则并禁止新请求。
        - reset 清除 ICache CPU owner、response valid 和可见 Cache valid 状态。已经握手的外部 AXI 事务由 AXIAributer drain。
    - id: axi_transaction_lifecycle
      ownerRole: axi_aributer
      producerRoles:
        - axi_aributer
      consumerRoles:
        - icache
        - dcache
        - core
        - control
      affectedResources:
        - axi_owner
        - transaction_kind
        - beat_count
        - drain
      rules:
        - AXIAributer 在 idle 时最多接受一个 Cache transaction request。同拍 ICache 与 DCache 竞争时 DCache 优先于 ICache；DCache miss FSM 自身保证 D_WRITEBACK 完成后才提出 D_REFILL。
        - transaction request.fire 同拍设置 axi_busy，并锁存 owner、transactionKind、transaction descriptor、beat count 初值和未发布通道状态。owner 至少区分 ICache 与 DCache，transactionKind 至少区分 I_REFILL、D_REFILL 和 D_WRITEBACK。
        - descriptor 已接受且 ARVALID 或 AWVALID 尚未置一时，reset 取消本地事务，清除 busy、owner、transactionKind、descriptor、beatCount和通道状态，不产生外部 valid、Cache response或 drain。reset 与同拍新 transaction request grant 冲突时 reset 获胜，request.ready为零。
        - ARVALID 或 AWVALID 一旦置一，即使 reset、redirect 或 terminal trap 到达，也必须保持 valid 与 payload 到 AR.fire或 AW.fire。reset 将 axi_drain 置一。redirect 或 terminal trap只把年轻 I_REFILL置 stale；D_REFILL和 D_WRITEBACK 保持原 owner。
        - reset 与 AR.fire同拍时 AR handshake 有效，owner、I_REFILL或D_REFILL kind、descriptor和 drain跨边界保持，随后拉高 RREADY并消费全部 R beat到 RLAST。reset 与 AW.fire同拍时 AW handshake有效，D_WRITEBACK owner、descriptor和 drain跨边界保持，随后发送全部 W beat并消费B。两种路径均不得产生 Cache line commit、CPU response或 completion。
        - 读事务从 AR.fire 后保持到 RLAST.fire。写事务从 AW.fire 后发送全部 W beat并保持到 B.fire。busy 期间 owner、transactionKind和descriptor稳定且禁止第二个AR或AW事务。
        - AR ready、R valid、R data、R last、AW ready、W ready 和 B valid只对登记 owner可见。非 owner Cache不得观察任何返回握手。
        - 普通事务终结边界清除 busy、owner、transactionKind、beatCount和通道状态；新 grant最早下一周期参与。drain事务在RLAST.fire或B.fire边界清除相同状态，新grant同样最早下一周期参与。
        - reset 命中已经发生 AR.fire、AW.fire或W.fire的事务时设置 drain，保留owner、transactionKind和剩余beat信息并吸收到RLAST或B。reset命中ARVALID或AWVALID等待ready时先保持valid到握手，再执行同一drain生命周期。
        - drain返回不产生 Cache line commit、CPU response、CPU completion、commit、retirement或store_visible_event。AXI rresp和bresp的合法输入只有正常响应，baseline不产生AXI access fault、cause 5、cause 7、错误恢复状态或错误Cache line回滚。
        - 架构断言要求 ARVALID和AWVALID在ready为零时跨reset保持valid与payload；reset同拍AR.fire后busy、owner、kind和drain保持到RLAST；reset同拍AW.fire后保持到B；仅未发布外部VALID的descriptor可被reset本地取消；任何drain期间禁止Cache提交与架构副作用。Stage2验证必须逐项覆盖这些边界。
    - id: memory_backpressure
      ownerRole: control
      producerRoles:
        - control
      consumerRoles:
        - fetch
        - decode
        - instruction_queue
        - issue
        - execute
        - memory
        - retire
      affectedResources:
        - pipeline_hold
        - instruction_queue_dequeue
      rules:
        - M1 存在未接受 DCache CPU request、DCache CPU owner 有效或 DCache completion 等待消费时，阻止 Issue/RR 到 EX、EX 到 M1 和新的 DCache CPU request 推进。
        - DCache 等待期间，M2/Retire 保持 owner 对应 Lane 组，Execute 及其后的年轻后端流水保持，Instruction Queue 停止出队。
        - Instruction Queue 在拍初容量允许时仍可接受 Decode 有序组；容量不足后 queue backpressure 保持 Decode、Fetch 和 ICache 新 CPU request。
        - DCache completion.fire 所在周期继续保持年轻后端，CPU owner、metadata 和 M2/Retire valid 在边界清除，年轻流水从下一周期恢复，避免 DCache completion 到 Issue 的组合接受路径。
        - ICache miss 只阻塞前端；已经进入 Instruction Queue 和后端的指令继续推进，直到其他资源产生独立 backpressure。
        - 年轻 Execute redirect 不取消已接受的较老 DCache CPU owner。Store 请求只有在全部较老指令正常退休且自身合法、对齐时才能 request.fire。
    - id: instruction_queue_control
      ownerRole: instruction_queue
      producerRoles:
        - instruction_queue
      consumerRoles:
        - decode
        - issue
        - control
      affectedResources:
        - entries
        - head
        - tail
        - count
      rules:
        - reset、terminal trap 和 Execute redirect 对 Instruction Queue 的清理依次优先于普通 dequeue、enqueue 和 hold；清理事件发生时同拍 dequeue 与 enqueue 均不提交。
        - DCache backpressure 或 completion.fire 周期阻止 Instruction Queue dequeue；Decode 有序组仍可按拍初 freeNow 入队，直到容量不足。
        - 普通周期根据 Issue/RR 实际接受数确定 dequeueCount，再独立根据拍初 freeNow 确定完整 Decode 组能否 enqueue；同拍 dequeue 释放的 entry 不参与本拍入队许可。
        - terminal trap 清空全部 entry。Execute redirect 清空全部 entry，因为它们均年轻于 EX redirect owner。
        - valid、head、tail 和 count 每拍最多更新一次，kill 覆盖 hold。
    - id: pairing_and_serialization
      ownerRole: issue
      producerRoles:
        - issue
      consumerRoles:
        - instruction_queue
        - regfile
        - execute
      affectedResources:
        - lane_0
        - lane_1
        - dequeue_count
      rules:
        - Lane 0 是最老候选，可以单独发射；Lane 1 只能与 Lane 0 同周期发射。
        - Lane 1 只允许不含访存、控制流、FENCE 和 terminal trap 行为的简单整数 ALU 指令。
        - Lane 1 使用的源寄存器命中 Lane 0 非零目的寄存器，或两条 Lane 写同一非零目的寄存器时，指令对串行化。
        - 串行化时只发射 Lane 0，原 Lane 1 保留为下一次 issue 的最老候选。
        - 操作数在退休前已经捕获，同拍 WAR 无需保护；写 x0 不形成依赖。
    - id: cross_cycle_dependencies
      ownerRole: issue
      producerRoles:
        - issue
      consumerRoles:
        - regfile
        - execute
        - memory
        - retire
      affectedResources:
        - forwarding_sources
        - load_completion
      rules:
        - 每个被使用的源操作数优先选择最年轻的较老匹配非零目的寄存器，再回退到寄存器堆。
        - Forwarding 优先级为 EX Lane 1、EX Lane 0、M1 Lane 1、M1 Lane 0、M2/Retire Lane 1、M2/Retire Lane 0；只有结果完成且会写寄存器的匹配项有效。
        - EX 可以前递已完成的整数、upper-immediate 和 link 结果；Load 结果只在 DCache CPU completion 被 M2/Retire 消费后有效。
        - 最年轻匹配生产者尚未完成时，hold Issue/RR 和全部年轻流水级，直到结果可前递或生产者触发 trap。
        - M2/Retire 写回值通过 retire_forwarding 在同周期可见，寄存器堆在周期边界更新。被 kill、trap、invalid、不写寄存器或 rd=x0 的表项不能前递。
    - id: register_file_timing
      ownerRole: regfile
      producerRoles:
        - regfile
      consumerRoles:
        - issue
        - retire
      affectedResources:
        - integer_registers
        - writeback_ports
      rules:
        - 寄存器读取组合观察周期边界前的架构状态，x0 始终读出零。
        - M2/Retire 边界最多写两个不同的非零目的寄存器，程序顺序为 Lane 0 后 Lane 1。
        - baseline 禁止同拍 WAW，写 x0 被忽略。
    - id: fence_serialization
      ownerRole: control
      producerRoles:
        - control
      consumerRoles:
        - issue
        - memory
        - dcache
        - retire
        - axi_aributer
      affectedResources:
        - store_visibility
        - dcache_owner
        - axi_owner
      rules:
        - FENCE 只能由 Lane 0 执行。
        - FENCE 只有在全部较老 Store 已产生 store_visible_event、DCache 没有较老 CPU owner 或活动 FSM、AXIAributer idle且没有较老 D_WRITEBACK 或 D_REFILL 时才能进入 M2/Retire。
        - FENCE 活跃期间，年轻指令不能发起 DCache CPU request，也不能越过 FENCE 退休。
        - FENCE 不发起外部请求，不扫描或写回所有 resident dirty line，并作为不写寄存器的普通指令在 M2/Retire 退休。
    - id: control_flow_targets
      ownerRole: execute
      producerRoles:
        - execute
      consumerRoles:
        - control
        - fetch
      affectedResources:
        - redirect_target
        - redirect_applied
      rules:
        - JALR 使用 rs1 加立即数计算目标并无条件清除 bit 0；branch 和 JAL 使用 PC 加立即数计算目标。
        - baseline 的 IALIGN 为 32。taken branch、JAL 或完成 bit 0 清除后的 JALR 目标若不是四字节对齐，由该控制流指令在 EX 报告 instruction-address-misaligned terminal trap。
        - 非 taken branch 不因未采用目标地址非对齐而触发 trap。目标非对齐时不发出 redirect、不写 link 寄存器，badAddress 报告最终目标。
        - 只有无异常且目标对齐的 taken branch、JAL 和 JALR 才发出 redirect。
    - id: redirect_and_flush
      ownerRole: control
      producerRoles:
        - control
      consumerRoles:
        - fetch
        - icache
        - decode
        - instruction_queue
        - issue
        - execute
        - memory
        - retire
      affectedResources:
        - redirect_event
        - young_pipeline_state
        - stale_drain
      rules:
        - 合法 redirect_event 当且仅当 EX Lane 0 valid、控制流成立、目标对齐、无 exception 且 redirect_applied 为零。redirect_event 接受边界设置 redirect_applied。
        - Lane 0 redirect_event 清除同组 Lane 1、Issue/RR、Instruction Queue、ID、Fetch PF request 和 IF response buffer；redirect Lane 0 自身保持或正常进入 M1。
        - 已接受且程序年龄早于 redirect owner 的 M1、M2/Retire 和 DCache CPU owner 保持。较老 M1 request.fire 或较老 DCache completion 可以与 redirect_event 同拍提交。
        - redirect 清除旧路径 ICache CPU response并将已接受 miss 标记 stale。已获 AXI owner 的旧事务由 AXIAributer drain 到 RLAST，禁止旧路径 Cache line commit。
        - redirect target 只有在旧 ICache CPU owner、stale 和 AXI drain 结束后才能启动。
    - id: precise_terminal_trap
      ownerRole: control
      producerRoles:
        - control
      consumerRoles:
        - control
        - fetch
        - icache
        - decode
        - instruction_queue
        - issue
        - execute
        - memory
        - dcache
        - retire
        - axi_aributer
      affectedResources:
        - terminal_trap_state
        - young_pipeline_state
        - drain
      rules:
        - Decode 标记不支持编码、ECALL 和 EBREAK；EX 标记控制流目标、Load 地址和 Store 地址非对齐。M2/Retire 不从 AXI rresp 或 bresp 产生异常。
        - baseline 可报告的 terminal_trap cause 仅为 0、2、3、4、6 和 11。cause 5、cause 7、AXI access fault 和错误恢复状态不存在。
        - 携带 exception metadata 的指令不能写寄存器、发起 DCache CPU request或产生 Store visible。M2/Retire 将最老异常报告为 terminal trap 并抑制全部年轻副作用。
        - 只有 Lane 0 可以携带异常或 terminal trap 行为；原 Lane 1 异常指令保留在 Instruction Queue，后续成为 Lane 0。Lane 0 异常 kill 同组 Lane 1。
        - terminal trap 报告前不存在未决的更老 DCache CPU owner。年轻 ICache 外部事务标记 stale并由 AXIAributer drain；trap 后禁止新 Cache CPU request。
    - id: valid_stall_kill
      ownerRole: control
      producerRoles:
        - control
      consumerRoles:
        - fetch
        - icache
        - decode
        - instruction_queue
        - issue
        - execute
        - memory
        - dcache
        - retire
        - axi_aributer
      affectedResources:
        - pipeline_valid
        - owner_state
        - response_valid
      rules:
        - reset 清除 Fetch、ICache CPU侧状态、IF/ID、Instruction Queue、Issue/RR、EX、M1、DCache CPU侧状态、M2/Retire和全部架构副作用。Cache data payload可以保留旧值，valid与dirty状态按reset契约失效。
        - reset 同拍禁止新的 Cache transaction grant。AXI descriptor已接受且外部ARVALID或AWVALID尚未置一时可以本地取消；ARVALID或AWVALID已置一、或已经发生AR、AW、W握手时不得直接丢弃。AXIAributer设置drain并保留owner、transactionKind、descriptor和剩余beat状态，完成AR握手后吸收到RLAST，或完成AW、全部W和B，且不向Cache或流水产生正常completion。
        - M2/Retire terminal trap清除faulting Lane和同组Lane 1，并清除M1、EX、Issue/RR、Instruction Queue、ID和Fetch中的年轻valid；未完成ICache事务按stale drain处理。
        - EX redirect保留redirect Lane 0及全部更老M1、M2/Retire和DCache owner，清除同组Lane 1及其后的全部年轻valid。
        - kill覆盖作用范围内的stall、enqueue、dequeue、正常valid传递和低优先级payload更新。stall保持valid与全部payload。正常推进原子传递valid和payload，消费者接受后清除生产端。
    - id: ordered_retirement
      ownerRole: retire
      producerRoles:
        - retire
      consumerRoles:
        - regfile
        - control
        - core
      affectedResources:
        - writeback
        - commit_trace
        - store_visible_event
        - performance_counters
      rules:
        - Lane 0 先于 Lane 1 退休；Lane 1 只有在 Lane 0 不存在或同周期正常退休时才能退休。
        - 寄存器写在 M2/Retire 边界成为架构可见；baseline 禁止同拍 WAW，因此同周期两条退休指令不会写同一非零寄存器。
        - Store 只在同一 Store 的 DCache success completion.fire 时产生 store_visible_event、commit 和 retirement，且每条 Store 仅一次。
        - Load 只在同一 Load 的 DCache success completion.fire 时产生最终写回、commit 和 retirement。
        - 正常 M2/Retire retirement 可以与更年轻 M1 request.fire、Execute redirect 或 ICache response 事件同拍；terminal trap 抑制 faulting 指令及全部年轻 retirement。
  counterRules:
    - name: cycles
      increment: Reset 释放后的每个周期加一，包括 stall 周期和报告终止 trap 的周期。
      exclusions:
        - Reset 有效周期
    - name: retired_instructions
      increment: 按本周期退休的 valid 且不触发 trap 的指令数增加。
      exclusions:
        - 被 kill 的指令、invalid Lane、终止 trap 指令
    - name: dual_issue_cycles
      increment: 两条 valid 指令同周期从 Issue 被 Execute 接受时加一。
      exclusions:
        - 被依赖或结构限制拒绝的指令对、backpressure hold 周期
    - name: target_raw_pairs
      increment: 一个原本合法的 Lane 0 ALU 生产者与 Lane 1 ALU 消费者仅因 baseline 同拍 RAW 禁令而串行化时加一。
      exclusions:
        - 同时受 WAW、控制流、访存、invalid Lane 或其他结构规则阻塞的指令对
verification:
  referenceModel: |-
    参考模型采用逐条执行的 RV32I 标量模型。标量模型只消费 commit_trace、store_visible_event 和 terminal_trap，不观察 Cache hit、miss、refill、writeback、CPU completion 或 AXI 握手周期。

    commit_trace 每周期包含两个无 backpressure Lane。每个 Lane 包含 valid、pc、instruction、rd、rdWrite 和 rdData。模型按 Lane 0、Lane 1 的程序顺序处理。Store、FENCE 及其他无寄存器写回的正常指令仍产生 commit。faulting 或 killed 指令不得产生 commit。

    store_visible_event 每周期最多一个，必须与同一 Store 的 Lane 0 commit 同拍且只产生一次。参考存储镜像只在 store_visible_event.valid 时按 address、byteMask 和 writeData 更新。DCache CPU request、completion、refill、writeback 和 AXI B 均不直接修改参考存储镜像。

    terminal_trap 包含 valid、cause、pc、instruction、badAddressValid 和 badAddress。cause 只允许 0、2、3、4、6、11。cause 0、4、6 设置 badAddressValid 并报告最终错误地址；cause 2、3、11 将 badAddressValid 和 badAddress 置零。valid 首次置位后保持到 reset。首次 trap 后不得出现新的 commit_trace、store_visible_event 或计数器更新。

    标量语义覆盖全部 supportedInstructions。Load 预期值从参考存储镜像读取，并在对应 commit_trace 中比较 rdData。Store 的 commit_trace 只检查指令退休，内存更新由同拍 store_visible_event 完成。FENCE 不更新寄存器或参考存储镜像。AXI rresp 和 bresp 只允许正常响应，非法响应由验证输入约束报告，不进入标量异常模型。

    ICache、DCache 和 AXIAributer 的周期行为由独立协议 scoreboard 检查。scoreboard 使用单项 AXI 事务队列，记录 owner、transactionKind、地址、长度、beat 序号和 drain。读事务保持到 RLAST 被消费，写事务保持到 B 被消费。返回只允许路由给已登记 owner。Cache line commit、CPU response、Store visible 和 stale、reset、terminal trap drain 的禁止组合由 scoreboard 与断言验证。

    固定 benchmark pairing_raw_4 使用冷启动配置：ICache 和 DCache 均为 64 sets、4 ways、64-byte line；AXI data width 为 32 bit，每行 16 beats；全部 Cache valid 清零，DCache dirty 清零，其余无效 payload 不参与比较。AXI 在 deterministic run 中不施加 backpressure，AR.fire 后下一周期开始连续返回 16 个正常 R beat，并在 beat 15 置 RLAST。该程序不产生 DCache 请求。

    pairing_raw_4 程序镜像位于 0x80000000，共 64 bytes。前四个 little-endian 指令字为 0x00100093、0x00200113、0x002081b3、0x00118213，其余字节为零。程序镜像 SHA-256 为 03024c755d84626c5b7b7acd1e4618021beb3cdc44be9127d17331584b1f314f。数据镜像为 64 个零字节，SHA-256 为 f5a5fd42d16a20302798ef6ed309979b43003d2320d9f0e8ea9831a92759fb4b。

    主 seed 为 0x5eed0001。验收命令为 sbt -Dseed=0x5eed0001 "testOnly *PairingRaw4Spec"。第四条指令退休后终止，timeout 为 128 cycles。预期 x1=1、x2=2、x3=3、x4=4，retired_instructions=4、dual_issue_cycles=1、target_raw_pairs=1，不产生 store_visible_event 或 terminal_trap。

    原 cycles=11 契约撤销。cycles 必须包含冷 miss、refill、Cache 内部寄存边界和流水停顿。Stage2 Unit Design 冻结 BRAM 读延迟与 Cache 内部完成边界后，必须给出新的精确 cycles 期望及推导记录，才能批准 pairing_raw_4 Design。
  layers:
    - 门禁1 模块级定向验证：Decoder、ALU、RegFile、Instruction Queue、流水控制、ICache、DCache、AXIAributer及BRAM wrapper的局部状态机、字段、事件优先级和断言全部通过。
    - 门禁2 集成级Cache/AXI协议验证：Cache CPU request与completion、hit、clean miss、dirty miss、writeback、refill、整行提交、Store visible、FENCE、全局单AXI owner、AR/R/AW/W/B backpressure、reset同拍handshake及redirect、reset、terminal trap drain全部通过。
    - 门禁3 端到端架构轨迹比较：标量RV32I模型按程序顺序比较commit_trace、store_visible_event和terminal_trap，并检查寄存器、参考存储镜像、异常、双发射顺序和全部计数器。
    - 门禁4 固定benchmark：使用冻结的程序与内存镜像哈希、Cache与AXI配置、冷启动状态、命令、仿真器版本、timeout、主seed、派生seed、预期commit、store、trap签名及最终寄存器和内存签名，结果全部匹配。
    - A_S1_008_GATE：门禁1到门禁4必须全部通过并分别保存执行命令、仿真器版本、主seed、派生seed、失败周期、实际握手轨迹和失败证据，Stage2才可完成。任一门禁缺失或失败时状态保持未完成。
    - verification/plan.md文末Stage2完成门禁只允许作为上述四类门禁的摘要，不形成较弱替代条件。其中baseline模块定向测试对应门禁1，集成测试必须完整包含门禁2，架构轨迹与计数器检查属于门禁3，固定benchmark门禁4必须单独执行。任何未明确包含门禁2或门禁4的旧完成列表无效。
  requiredScenarios:
    - 无依赖 ALU 指令对
    - 同拍 rs1 RAW
    - 同拍 rs2 RAW
    - 同拍双源 RAW
    - 跨周期 ALU 结果分别前递到每个被使用的源操作数
    - Load use 依赖保持到对应 DCache CPU completion.fire，不使用 refill beat、Cache 内部 data 或组合 completion 提前唤醒
    - 多个在途指令写同一源寄存器时选择最年轻的较老生产者
    - 同拍 M2/Retire 写回优先于周期边界前的寄存器堆值
    - 一般 ALU 指令目的寄存器为 x0
    - 同拍 WAW
    - 被串行化的 Lane 1 在下一次发射中成为 Lane 0，且不丢失、不重复
    - 每个指令对最多一条访存或控制流指令
    - JALR 清除 bit 0 后得到四字节对齐目标并正常 redirect
    - taken branch 的最终目标非四字节对齐，由该 branch 报告 cause 0，不发 redirect
    - JAL 的最终目标非四字节对齐，由 JAL 报告 cause 0，不发 redirect且不写 link 寄存器
    - JALR 清除 bit 0 后的最终目标仍非四字节对齐，由 JALR 报告 cause 0，不发 redirect且不写 link 寄存器
    - 非 taken branch 的未采用目标非四字节对齐时继续顺序执行，不产生 trap
    - 断言全部 ICache CPU request 地址四字节对齐，不设置独立 instruction access fault
    - 未映射外部存储地址返回正常 AXI response 和固定非法编码，在 Decode 报告 cause 2
    - LB、LBU 和 SB 在 address 低两位为 0、1、2、3 时均通过自然对齐检查
    - LH、LHU 和 SH 在 address 低两位为 0 或 2 时通过自然对齐检查
    - LH 和 LHU 在 address 低两位为 1 或 3 时报告 cause 4，且不产生 DCache CPU request
    - SH 在 address 低两位为 1 或 3 时报告 cause 6，且不产生 DCache CPU request 或 store_visible_event
    - LW 在 address 低两位为 0 时通过自然对齐检查，在 1、2、3 时报告 cause 4
    - SW 在 address 低两位为 0 时通过自然对齐检查，在 1、2、3 时报告 cause 6
    - Load 的 rd 为 x0 且地址对齐时仍完成 DCache CPU 事务并退休，不产生寄存器写回
    - Load 的 rd 为 x0 且地址非对齐时报告 cause 4，不产生 DCache CPU request
    - T_ICACHE_HIT：覆盖 tag 命中、同步 BRAM 读延迟、寄存 CPU response、response backpressure 和 owner 释放
    - T_ICACHE_CLEAN_MISS：覆盖 request owner、I_REFILL、全部 R beat、RLAST、整行提交和提交后 CPU response
    - A_ICACHE_BLOCKING：miss、refill、line commit 或未消费 response 期间拒绝后续 Fetch CPU request
    - A_ICACHE_NO_EARLY_RETURN：完整 Cache line 提交前不得产生 CPU response，不支持 partial refill hit、critical-word-first 或 early restart
    - T_DCACHE_HIT：覆盖全部 Load 宽度、Store byte mask、Store hit 行状态提交和寄存 CPU completion
    - T_DCACHE_CLEAN_MISS：覆盖 invalid 或 clean victim、D_REFILL、整行 data、tag、valid 和 dirty 目标状态提交
    - T_DCACHE_WRITE_ALLOCATE：Store miss 必须完成整行 refill 和目标 Store 更新后才能产生 success completion
    - T_DCACHE_DIRTY_MISS：固定 victim metadata，依次完成 AW、全部 W、B、refill AR、全部 R、RLAST、整行提交和 CPU completion
    - A_DCACHE_BLOCKING：CPU owner、completion、miss、writeback 或 refill 活跃期间拒绝后续 DCache CPU request
    - A_DCACHE_NO_EARLY_RETURN：Load 和 Store 均不得由部分 refill、已返回 beat 或组合写使能提前完成
    - A_CACHE_LINE_COMMIT：完整 Cache line 的 data、tag、valid 和 DCache dirty 目标状态在单一提交边界原子更新
    - T_CACHE_WRITE_PORT_CONFLICT：覆盖 refill commit 与 Store hit 写候选冲突，检查 reset 或 invalidate、refill commit、Store hit、hold 的优先级
    - T_STORE_VISIBLE：Store 行状态提交后的 success completion、store_visible_event、Lane 0 commit 和 retirement 同拍且只产生一次
    - T_STORE_VISIBLE_WRITEBACK：已退休 Store 的后续 dirty victim writeback 和 AXI B 不阻塞或撤销既有 store_visible_event
    - T_FENCE：等待全部较老 Store visible、DCache CPU owner 与 FSM 空闲、AXIAributer idle及较老 writeback/refill 完成；不扫描或写回全部 resident dirty line
    - T_REQUEST_REDIRECT：较老 M1 DCache CPU request.fire 与年轻 Execute redirect_event 同拍提交，较老 owner 保持
    - T_COMPLETION_REDIRECT：较老 Load 或 Store DCache CPU completion.fire 与年轻 Execute redirect_event 同拍提交，写回、Store visible 和 commit 保持原子
    - A_AXI_SINGLE_OWNER：全局最多一个 AXI owner，busy 期间 owner、transactionKind 和 descriptor 保持稳定
    - T_AXI_AR_BACKPRESSURE：ARREADY 任意延迟时 AR payload 保持稳定且不重复接受
    - T_AXI_R_BACKPRESSURE：覆盖 RVALID 间隙、接收端反压、全部 beat、beatCount 和 RLAST
    - T_AXI_AW_BACKPRESSURE：AWREADY 任意延迟时 AW payload 保持稳定
    - T_AXI_W_BACKPRESSURE：覆盖每个 W beat 的 WREADY 延迟、数据、WSTRB、beatCount 和 WLAST
    - T_AXI_B_BACKPRESSURE：覆盖 BVALID 延迟，写事务保持到 B 被消费
    - A_AXI_NORMAL_RESPONSE：验证环境只允许正常 rresp 和 bresp，非法输入由 assumption 或输入检查报告
    - T_AXI_ARBITRATION：ICache 与 DCache 同拍提出事务时按正式优先级选择，未获 grant 的请求保持，禁止第二个 outstanding
    - A_AXI_RETURN_ROUTE：R 和 B 只对登记 owner 可见，非 owner Cache 不得观察返回握手
    - A_AXI_OWNER_REUSE：事务完成边界不接受新 grant，owner 与事务槽从下一周期开始复用
    - T_REDIRECT_DRAIN：覆盖 redirect 位于 ICache AR 前、AR 同拍、AR 后、每个 R beat 和 RLAST 同拍；已获 owner 的旧路径事务 stale drain
    - T_RESET_DRAIN：覆盖 reset 位于 AR、AW、各 W beat、各 R beat、RLAST 和 B 阶段；已握手事务保持 owner并 drain
    - T_TERMINAL_TRAP_DRAIN：覆盖 terminal trap 位于 ICache AR 前后、各 R beat 和 RLAST；停止新 Cache CPU request并 drain 已握手年轻事务
    - A_DRAIN_NO_SIDE_EFFECT：stale、reset 或 terminal trap drain 不产生 Cache line commit、CPU response、CPU completion、commit、retirement 或 store_visible_event
    - T_REDIRECT_KILL：redirect Lane 0 保留，全部年轻流水、Fetch request 和 IF response buffer 被清除
    - T_TERMINAL_TRAP_KILL：faulting 指令及全部年轻指令不写寄存器、不产生 Store visible、不发 redirect且不退休
    - T_LANE1_EXCEPTION_RETENTION：Lane 1 非法指令、ECALL、EBREAK 或地址异常指令保留，后续成为最老 Lane 0
    - T_LANE0_TRAP_KILL：Lane 0 terminal trap kill 同组 Lane 1及全部年轻副作用
    - T_TERMINAL_TRAP_SCHEMA：cause 只允许 0、2、3、4、6、11，并检查 pc、instruction、badAddressValid 和 badAddress
    - T_COUNTER_FREEZE：terminal trap 指令不计入 retired_instructions，报告周期计入 cycles，随后全部计数器冻结
    - T_BRAM_SYNC_READ：ICache 和 DCache tag、data RAM 按一拍同步读契约检查请求周期、返回周期和命中判断边界
    - T_BRAM_BYTE_ENABLE：DCache Store hit 只修改 byteMask 选中的 byte lane
    - T_BRAM_READ_WRITE_COLLISION：覆盖同地址 tag/data 读写、正式旁路规则和目标器件 read-during-write 模式
    - T_BRAM_RESET_INIT：reset 清除 valid 和 dirty；无效 tag、data 和 replacement payload 不参与行为判断
    - T_REPLACEMENT_STATE：覆盖 hit 与 refill 后 replacement 更新、invalid way 选择和 dirty victim metadata 稳定
    - A_S1_006_OWNER_DOMAINS：每拍最多一个 DCache CPU request acceptance、一个 DCache CPU completion、一个 store_visible_event 和一个 redirect_event，全部副作用 owner 符合 Lane 年龄
    - A_S1_006_FORBIDDEN_COMBINATIONS：Lane 1 不拥有访存或控制流副作用；stale 或 drain 不产生正常完成；Store visible 必须匹配同一 Store 的 success completion 和 commit；terminal trap 报告前不存在未完成的更老 DCache CPU owner
    - A_S1_008_GATE：Stage2 完成要求模块级定向验证、集成级 Cache/AXI 协议验证、端到端架构轨迹比较和固定 benchmark 全部通过；每次运行记录命令、仿真器版本、主 seed、派生 seed、失败周期和实际握手轨迹
    - T_ICACHE_LINE_END_SINGLE：request PC 等于 lineBytes-4 且当前行 hit 时，CPU response 仅 Lane 0 valid，Lane 0 PC 等于 request PC并返回当前行最后一个word，Lane 1 valid为零且payload为零，顺序fetch PC更新为request PC加4
    - T_ICACHE_NEXT_LINE_HIT：行末单Lane response被IF response buffer接受后，下一周期或更晚以request PC加4发起普通ICache请求；下一行hit返回其首两个word，PC序列连续且不拼接两次response
    - T_ICACHE_NEXT_LINE_MISS：行末单Lane后对下一行首地址发起普通请求，覆盖I_REFILL全部R beat、RLAST、整行提交和提交后response；完整line提交前不得返回下一行指令
    - T_FETCH_LINE_BOUNDARY_BACKPRESSURE：分别延迟行末单Lane response.ready、Decode接受和下一行request.ready，检查IF response buffer的Lane valid、PC与instruction保持，旧owner释放后才允许第二个request.fire
    - T_FETCH_LINE_BOUNDARY_REDIRECT：在行末response等待、已接受以及下一行PF request等待ICache ready各边界注入redirect；redirect优先，清除旧顺序PC、PF request和IF response buffer，目标PC仅在旧owner与stale结束后启动
    - T_FETCH_LINE_BOUNDARY_TRAP_RESET：在行末response与下一行request等待各边界注入terminal trap和reset，检查停止新取指、清除Fetch CPU侧状态、禁止旧路径指令进入Decode，并按已发布AXI VALID或已握手状态执行drain
    - T_FETCH_LINE_BOUNDARY_STALE_DRAIN：下一行I_REFILL已取得AXI owner后在ARVALID等待、AR.fire后、各R beat和RLAST边界注入redirect、terminal trap或reset，保持owner和beat状态到RLAST且不提交旧路径Cache line或CPU response
    - A_FETCH_LINE_BOUNDARY_SEQUENCE：对上述全部场景逐拍检查Lane valid和PC序列；每个顺序PC对应的指令最多被IF response buffer、Decode和Instruction Queue各接受一次，且无丢失、无重复、无未请求下一行数据
  counters:
    - cycles
    - retired_instructions
    - dual_issue_cycles
    - target_raw_pairs
  decisionAcceptance:
    - decisionId: S1_DEC_001
      criteria:
        - T_S1_001_RV32I：Decoder 和标量参考模型覆盖每类受支持 RV32I 指令，并覆盖 x0、符号扩展、移位、比较、branch、jump、Load、Store、FENCE、ECALL、EBREAK、JALR bit 0 和 IALIGN=32。
        - T_S1_001_RV32I：JALR 清除目标 bit 0；taken branch、JAL 和 JALR 的最终目标按 IALIGN=32 检查，非 taken branch 不检查未采用目标的对齐。
        - A_S1_001_ILLEGAL：M 扩展及其他不支持编码不得进入合法 workload，并且只能按已批准异常策略进入非法指令 terminal trap。
    - decisionId: S1_DEC_002
      criteria:
        - T_S1_002_TOOLCHAIN：Windows Node.js、Processor Agent、Codex CLI 以及 WSL Java、SBT 和 Verilator 环境检查全部通过，命令与版本写入验证记录。
        - T_S1_002_PATH：Windows 盘符路径到 WSL 路径的转换测试通过，批准后的项目骨架可以在 WSL 执行 SBT smoke build。
    - decisionId: S1_DEC_003
      criteria:
        - T_S1_003_STAGE_FLOW：测试或 trace 分别观察 PF/ICache S1、IF/ICache S2、ID、Issue/RR、EX、M1 和 M2/Retire 的 valid、PC、正常推进、hold、kill、释放和 reset。
        - T_S1_003_IQ：覆盖 Instruction Queue 的零条、单条和双条原子入队，单条和双条出队，串行化保留，hold，redirect kill，terminal trap kill，reset，entry 释放与下一拍复用，empty、full 和 queue backpressure。
        - A_S1_003_IQ_REUSE：断言 instructionQueueEntries 大于零且为偶数；默认容量 8 和非 2 次幂偶数容量 6 均通过回绕测试；同拍出队产生的空洞不得用于本拍入队，拍初已空闲的 tail entry 可以用于本拍入队，同一 entry 不得在同一边界同时释放和分配。
        - T_S1_003_FORWARD：覆盖 EX、M1 和 M2/Retire 的跨周期 ALU forwarding；Load use 保持到 DCache CPU completion.fire，随后覆盖 M2/Retire 同拍 forwarding 和最年轻较老生产者选择。
    - decisionId: S1_DEC_004
      criteria:
        - T_S1_004_LANE_CAPABILITY：Lane 0 接受全部受支持指令；Lane 1 接受简单整数 ALU，并拒绝 Load、Store、控制流、FENCE、异常和 terminal trap 指令。
        - A_S1_004_LANE_RETENTION：被 Lane 1 能力限制拒绝的原第二条指令保持在 Instruction Queue，并在后续成为最老 Lane 0；程序序列无丢失、无重复，副作用只有一个所有者。
    - decisionId: S1_DEC_005
      criteria:
        - T_S1_005_RAW_WAW：覆盖同拍 rs1 RAW、rs2 RAW、双源 RAW、非零 rd WAW、rd 为 x0、未使用源字段以及独立 ALU 指令对；受禁止组合只发射 Lane 0，独立组合保持双发射。
        - T_S1_005_COUNTER：target_raw_pairs 只统计仅因 baseline 同拍 RAW 禁令而串行化的合法 ALU 指令对，同时受 WAW、Lane 能力、控制流、访存、invalid 或其他结构规则阻塞的周期不得计数。
    - decisionId: S1_DEC_006
      criteria:
        - T_S1_006_MEMORY_EVENTS：逐项检查 EX 地址、访问属性和对齐异常生成，EX 到 M1 memory_metadata 寄存，M1 DCache CPU request 发起与 request.fire，DCache 捕获 owner 与 metadata，M1 到 M2/Retire payload 移交，DCache CPU completion.fire、Load 写回、Store visible 和顺序退休。
        - A_S1_006_CACHE_CPU_OWNER：ICache 和 DCache 各自最多一个 CPU owner；request valid 等待期间 payload 稳定；owner 有效、Cache FSM 活跃或 completion 未消费期间拒绝后续 CPU request；completion.fire 后从下一周期复用 owner。
        - T_S1_006_CACHE_MISS：覆盖 ICache 和 DCache hit、clean miss、dirty miss、D_WRITEBACK 的 AW、全部 W 和 B、后续 D_REFILL、write allocate、全部 R beat、RLAST、整行 data、tag、valid、dirty 提交及提交后 response；禁止早启动、partial refill 和早返回。
        - T_S1_006_STORE：Store request.fire 不产生外部可见性；目标 Cache 行状态提交后的 DCache success completion、store_visible_event、Lane 0 commit 和 retirement 同拍且只出现一次；后续 dirty victim writeback 与 AXI B 不阻塞或撤销该 Store。
        - T_S1_006_AXI：覆盖 ICache 与 DCache 仲裁、全局单 AXI owner、owner 与 transactionKind 稳定、AR、R、AW、W、B 全通道 backpressure、返回仅路由登记 owner、读事务保持到 RLAST、写事务保持到 B以及事务完成后下一周期复用。
        - T_S1_006_DRAIN：覆盖 redirect stale drain、reset drain 和 terminal trap drain 位于各 AXI 阶段；drain 保留 owner 和 beat 状态到 RLAST 或 B，禁止 Cache commit、CPU completion、commit、retirement 和 store_visible_event。
        - T_S1_006_FENCE：FENCE 等待全部较老 Store visible、DCache CPU owner 与 FSM 空闲、AXIAributer idle及较老 writeback/refill 完成；FENCE 不扫描或写回全部 resident dirty line。
        - A_S1_006_SIDE_EFFECT_OWNER：每周期最多一个 DCache CPU request acceptance、一个 DCache CPU completion、一个 store_visible_event 和一个 redirect_event；全部副作用 owner 必须是程序年龄正确的 Lane 0，较老已接受事务不受年轻 redirect 清除。
    - decisionId: S1_DEC_007
      criteria:
        - T_S1_007_TRAP：覆盖 illegal instruction、ECALL、EBREAK、taken branch、JAL 和 JALR 最终目标非四字节对齐、Load 和 Store 数据地址非对齐；terminal_trap cause 只允许 0、2、3、4、6、11。
        - T_S1_007_FETCH_ILLEGAL：未映射外部存储地址通过正常 AXI response 返回固定非法编码，并在 Decode 产生 cause 2；接口不产生独立 instruction access fault。
        - A_S1_007_AXI_NORMAL：验证环境只驱动正常 rresp 和 bresp；不得产生 cause 5、cause 7、AXI access fault、错误恢复状态或错误 Cache line 回滚。
        - T_S1_007_TRAP_DRAIN：terminal trap 阻止新的 Fetch、ICache 和 DCache CPU request；已获 AXI owner 的年轻 ICache 事务 stale drain 到 RLAST，返回不得产生 Cache line commit或架构副作用。
        - A_S1_007_SIDE_EFFECT：faulting 指令及其年轻指令不得产生寄存器写回、Store visible、redirect 或退休；terminal trap 指令不计入 retired_instructions；Lane 0 trap 必须 kill 同组 Lane 1；trap 报告前不存在未完成的更老 DCache CPU owner。
    - decisionId: S1_DEC_008
      criteria:
        - T_S1_008_TRACE：手工编码定向程序与标量 RV32I 参考模型按程序顺序比较 commit_trace、store_visible_event 和 terminal_trap；同拍双退休按 Lane 0 后 Lane 1 展开，参考存储镜像只由 store_visible_event 更新。
        - T_S1_008_PROTOCOL：独立 Cache 与 AXI scoreboard 检查 Cache CPU owner、hit、miss、writeback、refill、整行提交、Store visible、全局单 AXI owner、全部通道 backpressure、redirect stale drain、reset drain、terminal trap drain和 BRAM 行为。
        - T_S1_008_BENCHMARK：固定 benchmark 冻结程序镜像及哈希、Cache 与 AXI 参数、冷启动状态、初始内存镜像及哈希、预期 commit、store、trap 签名、最终寄存器和内存签名、计数器定义、命令、仿真器版本、timeout、主 seed 和派生 seed；cycles 精确期望在 Stage2 Unit Design 冻结 BRAM 与 Cache 完成边界后重新批准。
        - A_S1_008_GATE：模块级定向验证、集成级 Cache/AXI 协议验证、端到端架构轨迹比较和固定 benchmark 四类门禁全部通过后，Stage2 才能完成。
  completionCriteria:
    - 所有 baseline Implementation Unit 的模块级定向测试与断言通过。
    - Cache CPU、ICache、DCache 与 AXIAributer 集成协议测试通过。
    - 端到端 commit_trace、store_visible_event、terminal_trap 与标量 RV32I 参考模型一致。
    - 冻结镜像、配置、seed 和 timeout 的固定 benchmark 通过。
    - 每类门禁保存命令、工具版本、seed、失败周期、握手轨迹和日志引用。
scaffold:
  files:
    - path: build.sbt
      content: |
        ThisBuild / scalaVersion := "2.13.18"
        ThisBuild / organization := "processoragent.demo"
        ThisBuild / version := "0.1.0-SNAPSHOT"

        val chiselVersion = "7.14.0"

        lazy val root = (project in file("."))
          .settings(
            name := "dual-issue-demo",
            addCompilerPlugin(
              "org.chipsalliance" % "chisel-plugin" % chiselVersion cross CrossVersion.full
            ),
            libraryDependencies ++= Seq(
              "org.chipsalliance" %% "chisel" % chiselVersion,
              "org.scalatest" %% "scalatest" % "3.2.19" % Test
            ),
            scalacOptions ++= Seq("-deprecation", "-feature", "-unchecked")
          )
    - path: project/build.properties
      content: |
        sbt.version=1.12.11
  smokeChecks:
    - id: sbt_compile
      description: 在 WSL 编译已批准的空 Chisel 项目骨架。
      runner: wsl
      script: cd {{projectWslPath}} && sbt -batch compile
      required: true
