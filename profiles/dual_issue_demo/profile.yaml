schemaVersion: 1
id: dual_issue_demo
version: 0.7.0
displayName: 顺序双发射演示核
description: 一个规模受控、具有明确优化空间的顺序双发射 Chisel 处理器。

defaults:
  projectName: dual_issue_demo
  goal: 构建一个正确、可检查的顺序双发射 baseline，用于受控架构优化演示。
  useCase: 在同一冻结 baseline 上比较 Processor Agent 工作流与直接向 Codex 提需求的结果。
  constraints:
    - baseline 规模需要支持快速迭代和定向验证。
    - 保持程序顺序和顺序退休语义。
    - 暴露周期数、退休指令数、双发射周期数和目标配对数计数器。
  exclusions:
    - Cache 和虚拟内存
    - 超标量乱序执行
    - 完整特权架构
    - 自动时序闭合

environmentChecks:
  - id: host_node
    description: Windows Node.js 控制端
    runner: host
    command: node
    args: ["--version"]
    required: true
  - id: host_codex
    description: Windows Codex CLI Agent Runtime
    runner: host
    command: codex
    args: ["--version"]
    required: true
  - id: wsl_java
    description: WSL Java 运行环境
    runner: wsl
    script: java -version
    required: true
  - id: wsl_sbt
    description: WSL SBT 构建工具
    runner: wsl
    script: sbt --script-version
    required: true
  - id: wsl_verilator
    description: WSL Verilator 仿真器
    runner: wsl
    script: verilator --version
    required: true

decisions:
  - id: S1_DEC_001
    topic: ISA Profile
    question: baseline 实现哪个 ISA 子集？
    whyNow: Decoder、架构状态、参考模型、测试和指令编码均依赖此选择。
    blocking: true
    researchPolicy: required
    dependsOn: []
    knownFacts:
      - 当前 WSL 环境没有外部 RISC-V 编译器和 Spike 可执行文件。
      - 本地标量参考模型可以避免第一版 Demo 依赖外部 ISA 工具链。
    recommendation: rv32i
    affectedArtifacts:
      - architecture/overview.md
      - architecture/modules.yaml
      - verification/plan.md
    options:
      - id: rv32i
        label: RV32I
        summary: 实现定向测试和 benchmark 所需的完整 RV32I 基础整数指令集。
        consequences:
          - 除访存操作外，执行延迟保持统一。
          - baseline 不引入乘除法器状态。
          - 需要维护一个小型 RV32I 参考模型。
      - id: rv32im
        label: RV32IM
        summary: 在 RV32I 基础上加入整数乘除法指令。
        consequences:
          - 引入多周期执行以及额外 stall 或握手规则。
          - 验证矩阵扩展到目标双发射机制之外。

  - id: S1_DEC_002
    topic: 执行环境
    question: Chisel 构建和仿真在哪个环境运行？
    whyNow: 项目命令、路径转换、环境证据和恢复方式依赖统一的执行边界。
    blocking: true
    researchPolicy: none
    dependsOn: []
    knownFacts:
      - Windows 已安装 Node.js 和已登录的 Codex CLI。
      - WSL 已安装 Java 17、SBT 和 Verilator。
    recommendation: windows_control_wsl_execution
    affectedArtifacts:
      - architecture/overview.md
      - verification/plan.md
    options:
      - id: windows_control_wsl_execution
        label: Windows 控制，WSL 执行
        summary: Processor Agent 和 Codex 在 Windows 运行，Chisel 构建与仿真命令在 WSL 运行。
        consequences:
          - 需要确定性的 Windows 到 WSL 路径转换。
          - 可以直接复用当前已登录的 Codex CLI 和 Linux 硬件工具链。
      - id: wsl_only
        label: 全部在 WSL 运行
        summary: Processor Agent、Codex、构建和仿真全部在 WSL 运行。
        consequences:
          - 需要在 WSL 安装并登录受支持的 Codex CLI。
          - 消除 Windows 控制端与 WSL 执行端之间的边界。

  - id: S1_DEC_003
    topic: 流水线
    question: baseline 采用哪组流水级边界？
    whyNow: Forwarding、冒险检测、分支恢复、模块边界和测试时序均依赖流水级划分。
    blocking: true
    researchPolicy: required
    dependsOn: [S1_DEC_001]
    knownFacts:
      - 优化演示需要显式观察同周期发射的两条 ALU 指令之间的关系。
    recommendation: five_stage
    affectedArtifacts:
      - architecture/overview.md
      - architecture/modules.yaml
    options:
      - id: five_stage
        label: 五级流水线
        summary: 使用 IF、ID/Issue、EX、MEM 和 WB/Retire 五个边界。
        consequences:
          - baseline 结构紧凑且便于检查。
          - 配对和寄存器读取位于同一流水级。
          - baseline 仍禁止 Lane 0 到 Lane 1 的同拍 RAW；若后续 Architecture Change 加入 ALU 旁路，该旁路会形成显式组合路径。
      - id: six_stage_split_issue
        label: 拆分 Decode 与 Issue
        summary: 在 Decode 与 Issue/Register Read 之间增加寄存边界。
        consequences:
          - Decode 和配对逻辑获得更多时序余量。
          - 增加一个流水边界及对应恢复状态。

  - id: S1_DEC_004
    topic: Lane 能力
    question: 两条发射 Lane 分别允许执行哪些操作？
    whyNow: 配对合法性、结构冲突、结果选择和模块端口均依赖 Lane 能力。
    blocking: true
    researchPolicy: conditional
    dependsOn: [S1_DEC_003]
    knownFacts:
      - Lane 0 始终比 Lane 1 年老。
      - 首个优化目标是 ALU 生产者与消费者配对。
    recommendation: asymmetric
    affectedArtifacts:
      - architecture/overview.md
      - architecture/modules.yaml
      - verification/plan.md
    options:
      - id: asymmetric
        label: 非对称 Lane
        summary: Lane 0 接受全部受支持指令，Lane 1 只接受简单整数 ALU 指令。
        consequences:
          - 访存和控制流副作用只由较老的 Lane 0 发起。
          - Lane 1 保持精简，同时保留有价值的双发射机会。
      - id: symmetric_alu_branch
        label: 对称 ALU 与 Branch
        summary: 两条 Lane 均接受 ALU 和控制流指令，访存仍限定在 Lane 0。
        consequences:
          - 需要同拍控制流仲裁和更多恢复场景。
          - 增加与目标优化无关的逻辑。

  - id: S1_DEC_005
    topic: baseline 同拍 RAW
    question: baseline 如何处理 Lane 0 生产、Lane 1 消费的同拍 RAW？
    whyNow: 该规则定义优化空间和第一个 Architecture Change。
    blocking: true
    researchPolicy: conditional
    dependsOn: [S1_DEC_004]
    knownFacts:
      - 跨周期 forwarding 保持可用。
      - Lane 0 始终比 Lane 1 年老。
    recommendation: prohibit_same_cycle_raw
    affectedArtifacts:
      - architecture/overview.md
      - architecture/modules.yaml
      - verification/plan.md
    options:
      - id: prohibit_same_cycle_raw
        label: 禁止同拍 RAW
        summary: Lane 1 读取 Lane 0 写入的非零目的寄存器时，将该指令对串行化。
        consequences:
          - 得到正确且有意保守的 baseline。
          - 为产品对照实验保留一个精确优化目标。
      - id: allow_alu_bypass
        label: baseline 直接加入 ALU 旁路
        summary: 通过 Lane 0 到 Lane 1 的同拍旁路允许符合条件的 ALU RAW 配对。
        consequences:
          - 计划中的首个 Architecture Change 将从 Demo 中消失。
          - baseline 设计阶段就需要闭合同拍旁路契约和时序路径。

  - id: S1_DEC_006
    topic: 访存与控制流
    question: baseline 采用哪些访存和控制流限制？
    whyNow: 结构冲突、flush、backpressure 和外部接口均依赖这些限制。
    blocking: true
    researchPolicy: required
    dependsOn: [S1_DEC_003]
    knownFacts:
      - Demo 不需要 Cache 和虚拟内存。
    recommendation: single_side_effect_lane
    affectedArtifacts:
      - architecture/overview.md
      - architecture/modules.yaml
      - verification/plan.md
    options:
      - id: single_side_effect_lane
        label: 单一副作用 Lane
        summary: 每周期最多一条访存或控制流指令，固定进入 Lane 0，访存接口支持 decoupled backpressure。
        consequences:
          - 外部副作用和 redirect 具有唯一所有者。
          - 延迟访存响应需要显式 stall 规则。
      - id: fixed_latency_memory
        label: 固定延迟访存
        summary: 使用一周期 SRAM 风格响应，全部访存操作进入 Lane 0。
        consequences:
          - 第一版实现更简单。
          - baseline 无法展示通用 backpressure 行为。

  - id: S1_DEC_007
    topic: 异常范围
    question: 第一版 baseline 精确处理哪些异常条件？
    whyNow: Flush、退休、副作用抑制和参考模型均依赖异常边界。
    blocking: true
    researchPolicy: required
    dependsOn: [S1_DEC_001, S1_DEC_006]
    knownFacts:
      - 完整特权架构不属于第一版 Demo。
    recommendation: minimal_precise_stop
    affectedArtifacts:
      - architecture/overview.md
      - verification/plan.md
    options:
      - id: minimal_precise_stop
        label: 精确停止接口
        summary: 检测非法指令和非对齐访问，抑制年轻指令副作用，并向测试 Harness 报告终止 trap 记录。
        consequences:
          - 在不实现特权 trap CSR 的情况下保持精确顺序。
          - 测试可以观察明确的失败契约。
      - id: supported_stream_only
        label: 只接受受支持指令流
        summary: 将不支持的编码和非对齐访问排除在合法输入域之外。
        consequences:
          - baseline 控制逻辑更少。
          - 异常测试程序没有架构响应。

  - id: S1_DEC_008
    topic: 验证策略
    question: 哪种参考模型和 workload 策略作为 baseline 门禁？
    whyNow: Stage2 模块测试、集成完成、计数器和优化对照需要统一验收契约。
    blocking: true
    researchPolicy: required
    dependsOn: [S1_DEC_001, S1_DEC_005, S1_DEC_006, S1_DEC_007]
    knownFacts:
      - 当前 WSL 没有外部 RISC-V 编译器和 Spike 可执行文件。
    recommendation: embedded_reference
    affectedArtifacts:
      - verification/plan.md
      - architecture/modules.yaml
    options:
      - id: embedded_reference
        label: 内置参考模型
        summary: 使用手工编码定向程序、小型标量 ISA 模型和确定性配对 benchmark。
        consequences:
          - Demo 保持自包含和可复现。
          - 项目需要在测试旁维护参考模型。
      - id: external_riscv_tools
        label: 外部 RISC-V 工具
        summary: 安装 RISC-V 编译器和 Spike，并比较架构轨迹。
        consequences:
          - ISA 覆盖和外部验证能力更强。
          - Stage2 前增加安装和版本管理工作。

architecture:
  systemBoundary:
    - 使用单一高有效同步 reset，reset 释放后从 0x80000000 开始取指。
    - 地址和数据均为 32 位小端模型。
    - 指令存储器使用 decoupled 请求与响应；每个四字节对齐 fetch PC 返回两条连续 32 位指令。
    - 指令存储器响应不包含 error；测试 Harness 对所有已接受的对齐请求返回两个指令字，未映射地址返回固定非法编码并由 Decode 报告终止 trap。
    - 数据存储器使用单一 decoupled 请求与响应，包含 read、write、byte mask、address、write data、read data 和 error 字段。
    - 最多允许一个未完成数据存储器请求，其所有者保持到响应或终止 reset。
    - 成功的数据存储器响应使 Store 原子可见，error 响应不产生写入。
    - 向验证 Harness 暴露 commit trace、终止 trap 和性能计数器。
    - baseline 不实现 interrupt、debug、虚拟内存、Cache 和 MMIO。
  supportedInstructions:
    - "RV32I 高位立即数指令：LUI、AUIPC。"
    - "RV32I 跳转指令：JAL、JALR。"
    - "RV32I 分支指令：BEQ、BNE、BLT、BGE、BLTU、BGEU。"
    - "RV32I Load 指令：LB、LH、LW、LBU、LHU。"
    - "RV32I Store 指令：SB、SH、SW。"
    - "RV32I 立即数 ALU 指令：ADDI、SLTI、SLTIU、XORI、ORI、ANDI、SLLI、SRLI、SRAI。"
    - "RV32I 寄存器 ALU 指令：ADD、SUB、SLL、SLT、SLTU、XOR、SRL、SRA、OR、AND。"
    - FENCE 串行化简单数据存储器接口；ECALL 和 EBREAK 向 Harness 报告终止 trap。
  invariants:
    - 每个被接受的指令对中，Lane 0 始终比 Lane 1 年老。
    - 架构退休保持程序顺序。
    - 较老指令报告终止 trap 后，年轻指令不能提交。
    - x0 在受支持 RISC-V Profile 中始终为零。
    - 每周期最多退休两条指令。
    - 外部访存和 redirect 副作用在同一周期内只有一个所有者。
  sharedFields:
    - name: valid
      semantics: 当前 Lane 保存一条活跃指令，其 payload 字段可以被消费。
      producer: fetch 和各流水寄存器
      consumers: [decode, issue, execute, memory, retire, control]
      validFrom: fetch 响应被接受
      validUntil: 退休、redirect kill、终止 trap kill 或 reset
    - name: pc
      semantics: 当前 Lane 对应指令的字节地址。
      producer: fetch
      consumers: [decode, execute, retire, commit_trace]
      validFrom: fetch 响应被接受
      validUntil: 退休或 kill
    - name: instruction
      semantics: 用于 Decode 和轨迹比较的原始 32 位 RV32I 编码。
      producer: fetch
      consumers: [decode, retire, commit_trace]
      validFrom: fetch 响应被接受
      validUntil: 退休或 kill
    - name: lane_age
      semantics: 同一发射周期中 Lane 0 比 Lane 1 年老。
      producer: issue
      consumers: [execute, memory, retire, control]
      validFrom: issue 接受
      validUntil: 退休或 kill
    - name: decoded_control
      semantics: 操作类型、源寄存器使用标记、立即数、目的寄存器、写使能、访存宽度和符号属性。
      producer: decode
      consumers: [issue, execute, memory, retire]
      validFrom: Decode 成功
      validUntil: 退休或 kill
    - name: operands
      semantics: 完成跨周期 forwarding 后送入 Execute 的寄存器或立即数操作数。
      producer: issue 和 regfile
      consumers: [execute]
      validFrom: issue 接受
      validUntil: Execute 消费或 kill
    - name: result
      semantics: 供退休选择的 ALU 结果、分支目标、有效地址或 Load 返回值。
      producer: execute 或 memory
      consumers: [memory, retire, regfile, commit_trace]
      validFrom: 操作完成
      validUntil: 退休或 kill
    - name: memory_metadata
      semantics: 访存类型、宽度、byte mask、地址、Store 数据和所有 Lane。
      producer: execute
      consumers: [memory, retire, control]
      validFrom: 有效地址计算完成
      validUntil: 访存响应、终止 trap 或 reset
    - name: exception
      semantics: 精确终止 trap 的 valid、cause、故障 PC 和可选 bad address。
      producer: decode、execute 或 memory
      consumers: [retire, control, commit_trace]
      validFrom: 检测到异常
      validUntil: 报告终止 trap 或 reset
    - name: redirect
      semantics: 较老控制流指令解析出的 valid 和目标 PC。
      producer: execute
      consumers: [control, fetch, pipeline valid registers]
      validFrom: Execute 解析完成
      validUntil: 同周期接受 redirect
  globalProtocols:
    - id: control_priority
      owner: control
      rules:
        - 同拍优先级依次为 reset、终止 trap、Execute redirect、访存 backpressure、正常推进。
        - 高优先级动作覆盖流水寄存器 hold 和同拍低优先级 valid 更新。
        - Control 输出是当前周期组合决策，流水寄存器只在周期边界更新。
    - id: memory_backpressure
      owner: control
      rules:
        - 数据存储器请求被接受后，memory 保持请求所有者和 metadata，直到响应到达。
        - 等待响应期间，fetch、decode、issue 和 execute 流水寄存器保持，不能接受年轻请求。
        - 年轻级保持时，retire 可以消费已经完成的较老指令。
        - 已保持的外部请求不受年轻 redirect 影响，reset 结束仿真契约并清除所有权。
        - Store 请求只有在全部较老指令正常退休且自身合法、对齐时才能被接受。
        - Store 从 EX 进入 MEM 后保持在 MEM，直到数据存储器响应；请求被接受本身不产生外部可见写入。
        - 等待 Store 响应期间，年轻流水级保持；其中的指令可以保留已经计算的 payload，不能继续推进、退休或产生寄存器和访存副作用。
        - 成功响应、Store 外部可见和 Store 退休在同一周期边界原子发生；error 响应在该边界报告终止 trap，且内存保持不变。
    - id: instruction_fetch_ownership
      owner: fetch
      rules:
        - Fetch 最多允许一个未完成指令存储器请求，并保持请求 PC 直到响应被接受。
        - Fetch 在请求被接受前保持 valid 和 PC 稳定，下游保持时最多缓存一个返回指令对。
        - 正常响应将 Lane 0 PC 设为请求 PC，Lane 1 PC 设为请求 PC 加 4；指令对进入缓冲后，下一个顺序请求 PC 加 8。
        - 指令对串行化不重复推进 fetch PC，原 Lane 1 保持到成为最老 issue 候选。
        - Redirect kill 已缓冲的年轻指令对；未完成响应标记为 stale，排空并丢弃后才能请求 redirect 目标。
        - 全局访存 backpressure 阻止新 fetch 请求，不丢弃已经接受的响应；reset 清除 fetch 所有权和缓冲。
    - id: pairing_and_serialization
      owner: issue
      rules:
        - Lane 0 是最老候选，可以单独发射；Lane 1 只能与 Lane 0 同周期发射。
        - Lane 1 只允许不含访存、控制流、FENCE 和终止 trap 行为的简单整数 ALU 指令。
        - Lane 1 使用的源寄存器命中 Lane 0 非零目的寄存器，或两条 Lane 写同一非零目的寄存器时，指令对串行化。
        - 指令对串行化时发射 Lane 0，并将原 Lane 1 保留为下一次 issue 的最老候选。
        - 操作数在退休前已经捕获，同拍 WAR 无需保护；写 x0 不形成依赖。
    - id: cross_cycle_dependencies
      owner: issue
      rules:
        - 每个被使用的源操作数优先选择最年轻的较老匹配非零目的寄存器，再回退到寄存器堆。
        - Forwarding 优先级为 EX Lane 1、EX Lane 0、MEM Lane 1、MEM Lane 0、Retire Lane 1、Retire Lane 0；只有结果完成且会写寄存器的匹配项有效。
        - EX 可以前递已完成的整数、upper-immediate 和 link 结果；Load 只在成功数据存储器响应后前递。
        - 最年轻匹配生产者尚未完成时，hold issue 和全部年轻流水级，直到结果可前递或生产者触发 trap。
        - 退休写通过 Retire forwarding 在同周期对 issue 可见，寄存器堆存储在周期边界更新。
        - 被 kill、触发 trap、invalid、不写寄存器或目的寄存器为 x0 的表项不能前递。
    - id: register_file_timing
      owner: regfile
      rules:
        - 寄存器读取组合地观察周期边界前的架构状态，x0 始终读出零。
        - 退休边界最多写两个不同的非零目的寄存器，程序顺序为 Lane 0 后 Lane 1。
        - baseline 禁止同拍 WAW，写 x0 被忽略。
    - id: fence_serialization
      owner: control
      rules:
        - 所有受支持 FENCE 编码在简单外部接口上实现为完整数据存储器屏障。
        - FENCE 只有在全部较老数据存储器请求完成且没有未完成请求时才能进入退休。
        - FENCE 活跃期间，年轻指令不能发起数据存储器请求，也不能越过 FENCE 退休。
        - FENCE 不发起外部请求，作为不写寄存器的普通指令退休。
    - id: control_flow_targets
      owner: execute
      rules:
        - JALR 使用 rs1 加立即数计算目标并无条件清除 bit 0；branch 和 JAL 使用 PC 加立即数计算目标。
        - baseline 的 IALIGN 为 32。Taken branch、JAL 或完成 bit 0 清除后的 JALR 目标若不是四字节对齐，由该控制流指令在 EX 报告 instruction-address-misaligned 终止 trap。
        - 非 taken branch 不因未采用的目标地址非对齐而触发 trap。
        - 控制流目标非对齐时不发出 redirect，不写 link 寄存器；trap 的 faulting PC 是控制流指令 PC，bad address 是最终计算目标。
        - 只有无异常且目标对齐的 taken branch、JAL 和 JALR 才发出 redirect。
    - id: redirect_and_flush
      owner: control
      rules:
        - baseline 只有 Lane 0 可以包含控制流指令。
        - Lane 0 的 taken branch 或 jump 在任何 writeback 或访存副作用前抑制同指令对 Lane 1。
        - Redirect 清除所有年轻 valid，包括 redirect 所有者之后的 fetch、decode、issue 和 execute 指令。
        - Fetch 在下一个周期边界观察 redirect 目标。
    - id: precise_terminal_trap
      owner: control
      rules:
        - Decode 标记不支持编码、ECALL 和 EBREAK；Execute 标记取指地址和数据地址非对齐；Memory 传播响应 error。
        - 携带 exception metadata 的指令不能写寄存器，也不能产生数据存储器副作用。
        - Retire 将最老异常报告为一条终止 trap 记录，并在副作用前抑制全部年轻指令。
        - 只有 Lane 0 可以携带异常或终止 trap 行为；原 Lane 1 的异常指令先被保留并在后续成为 Lane 0。
        - Lane 0 异常总是 kill 同指令对 Lane 1。
    - id: valid_stall_kill
      owner: control
      rules:
        - Reset 和 kill 无视 stall 清除 valid。
        - Stall 同时保持 valid 和全部 payload 字段。
        - 正常推进原子传递 valid 与 payload，消费者接受后清除生产端。
        - invalid 状态下 payload 可以保留旧值，消费者必须忽略。
    - id: ordered_retirement
      owner: retire
      rules:
        - Lane 0 先于 Lane 1 退休；Lane 1 只有在 Lane 0 不存在或同周期正常退休时才能退休。
        - 寄存器写在退休时成为架构可见；baseline 禁止同拍 WAW，因此同周期两条退休指令不会写同一非零寄存器。
        - Store 只在 Lane 0 数据存储器请求得到成功响应时对外可见。
  counterRules:
    - name: cycles
      increment: Reset 释放后的每个周期加一，包括 stall 周期和报告终止 trap 的周期。
      exclusions: [Reset 有效周期]
    - name: retired_instructions
      increment: 按本周期退休的 valid 且不触发 trap 的指令数增加。
      exclusions: [被 kill 的指令、invalid Lane、终止 trap 指令]
    - name: dual_issue_cycles
      increment: 两条 valid 指令同周期从 Issue 被 Execute 接受时加一。
      exclusions: [被依赖或结构限制拒绝的指令对、backpressure hold 周期]
    - name: target_raw_pairs
      increment: 一个原本合法的 Lane 0 ALU 生产者与 Lane 1 ALU 消费者仅因 baseline 同拍 RAW 禁令而串行化时加一。
      exclusions: [同时受 WAW、控制流、访存、invalid Lane 或其他结构规则阻塞的指令对]
  modules:
    - id: fetch
      responsibility: 维护 fetch PC，并提供最多两条带 PC 和 valid 的顺序指令。
      stateOwnership: [fetch_pc, outstanding_fetch_pc, stale_response, fetch_response_buffer]
      dependsOn: []
      interfaces: [instruction_memory, fetch_to_decode, redirect, global_stall, pipeline_kill]
    - id: decode
      responsibility: 译码受支持 ISA，并生成与 Lane 无关的控制记录。
      stateOwnership: []
      dependsOn: [fetch]
      interfaces: [fetch_to_decode, decode_to_issue, decode_exception, global_stall, pipeline_kill]
    - id: regfile
      responsibility: 维护架构整数寄存器，并为两条 issue Lane 提供操作数。
      stateOwnership: [integer_registers]
      dependsOn: []
      interfaces: [read_ports, writeback_ports, retire_forwarding]
    - id: issue
      responsibility: 检查配对合法性、程序顺序、结构限制、同拍依赖策略，并限制 Lane 1 只接受简单整数 ALU 指令。
      stateOwnership: []
      dependsOn: [decode, regfile, execute, memory, retire]
      interfaces: [decode_to_issue, operand_reads, forwarding_sources, issue_to_execute, global_stall, pipeline_kill]
    - id: execute
      responsibility: 执行两条 Lane 的 ALU 和控制流操作，并生成 redirect 或结果 metadata。
      stateOwnership: []
      dependsOn: [issue]
      interfaces: [issue_to_execute, execute_to_memory, execute_forwarding, redirect, execute_exception, global_stall, pipeline_kill]
    - id: memory
      responsibility: 维护一个未完成数据存储器请求，并返回 Load 数据或 Store 完成状态。
      stateOwnership: [memory_request_owner]
      dependsOn: [execute]
      interfaces: [execute_to_memory, data_memory, memory_to_retire, memory_forwarding, memory_exception, backpressure, pipeline_kill]
    - id: retire
      responsibility: 按程序顺序退休结果、更新寄存器堆并报告终止 trap 和性能计数器。
      stateOwnership: [performance_counters, terminal_trap]
      dependsOn: [execute, memory, regfile]
      interfaces: [memory_to_retire, writeback_ports, exception, commit_trace, trap, counters]
    - id: control
      responsibility: 按优先级处理 reset、终止 trap、redirect 和访存 stall，并驱动全局 hold 与 kill。
      stateOwnership: []
      dependsOn: [execute, memory, retire]
      interfaces: [redirect, exception, backpressure, global_stall, pipeline_kill]
    - id: core
      responsibility: 集成全部模块并暴露存储器、reset、commit trace、trap 和计数器接口。
      stateOwnership: []
      dependsOn: [fetch, decode, regfile, issue, execute, memory, retire, control]
      interfaces: [instruction_memory, data_memory, commit_trace, trap, counters]
  stage2Order: [regfile, fetch, decode, issue, execute, memory, retire, control, core]

verification:
  referenceModel: 面向选定 RISC-V 子集的小型标量参考模型。
  layers:
    - Decoder 与 ALU 单元测试
    - 配对合法性与冒险测试
    - Stall、flush、redirect 与 trap 测试
    - 端到端架构轨迹比较
    - 固定双发射 benchmark
  requiredScenarios:
    - 无依赖 ALU 指令对
    - 同拍 rs1 RAW
    - 同拍 rs2 RAW
    - 同拍双源 RAW
    - 跨周期 ALU 结果分别前递到每个被使用的源操作数
    - 延迟 Load-use 依赖保持到成功响应
    - 多个在途指令写同一源寄存器时选择最年轻的较老生产者
    - 同拍退休写优先于周期边界前的寄存器堆值
    - 目的寄存器 x0
    - 同拍 WAW
    - 被串行化的 Lane 1 在下一次发射中成为 Lane 0，且不丢失、不重复
    - 每个指令对最多一条访存或控制流指令
    - 数据存储器 backpressure
    - 指令存储器请求 backpressure
    - 指令存储器响应未完成时发生 redirect
    - JALR 清除 bit 0 后得到对齐目标
    - Taken branch、JAL 和 JALR 的非四字节对齐目标由控制流指令自身报告 trap，且不发出 redirect
    - 非 taken branch 不因未采用的非对齐目标触发 trap
    - 未映射取指地址返回非法编码并在 Decode 报告 trap
    - FENCE 等待较老数据存储器响应
    - Redirect 时存在 valid 年轻 Lane
    - 终止 trap 时存在 valid 年轻 Lane
    - 数据存储器 error 响应不产生 Store 可见性
    - 取指地址非对齐
    - Load 和 Store 数据地址非对齐
    - 终止 trap 指令不计入 retired_instructions
    - 较老数据存储器请求跨越年轻 redirect 保持
    - Reset 清除指令和数据存储器所有权
  counters: [cycles, retired_instructions, dual_issue_cycles, target_raw_pairs]
  decisionAcceptance:
    - decisionId: S1_DEC_001
      criteria:
        - Decoder 和标量参考模型覆盖每类受支持 RV32I 指令，并覆盖 x0、符号扩展、移位、比较、branch、jump、Load、Store、FENCE 和终止 trap 边界。
        - JALR 清除目标 bit 0，控制流目标按照 IALIGN=32 检查，并覆盖 taken 与非 taken branch 的非对齐差异。
        - M 扩展编码不进入合法 workload，并按已批准异常策略处理不支持编码。
    - decisionId: S1_DEC_002
      criteria:
        - Windows Node.js、Codex CLI、WSL Java、SBT 和 Verilator 环境检查全部通过。
        - Windows 盘符路径到 WSL 路径的转换测试通过，批准后的项目骨架可以在 WSL 执行 SBT smoke check。
    - decisionId: S1_DEC_003
      criteria:
        - 测试或 trace 可以识别 IF、ID/Issue、EX、MEM 和 WB/Retire 边界中的 valid 与 PC 推进。
        - 跨周期 ALU forwarding、Load-use hold 和 Retire 同拍 forwarding 均有定向测试。
    - decisionId: S1_DEC_004
      criteria:
        - Lane 1 接受简单整数 ALU，拒绝访存、控制流、FENCE 和终止 trap 指令。
        - 被拒绝的原 Lane 1 保留并在后续成为 Lane 0，且无丢失或重复。
    - decisionId: S1_DEC_005
      criteria:
        - 同拍 rs1、rs2 和双源 RAW 均串行化，独立 ALU 指令对保持双发射。
        - target_raw_pairs 只统计仅因 baseline 同拍 RAW 禁令而串行化的指令对。
    - decisionId: S1_DEC_006
      criteria:
        - 每周期最多一条访存或控制流副作用且所有者为 Lane 0。
        - 延迟响应、error 响应、未完成请求期间的 redirect 和 reset 所有权清理均有定向测试。
        - Store 在 MEM 中保持到响应，成功响应、外部可见和退休同边界发生；等待期间年轻指令不能退休或产生副作用。
    - decisionId: S1_DEC_007
      criteria:
        - 非法指令、取指地址非对齐、数据地址非对齐和存储器 error 均产生精确终止 trap。
        - Trap 指令及其年轻指令不产生寄存器或存储器副作用，退休计数符合排除规则。
        - 指令存储器接口没有 error 信号，未映射地址通过固定非法编码进入 Decode trap。
    - decisionId: S1_DEC_008
      criteria:
        - 手工编码程序与标量参考模型逐条比较 commit trace。
        - 固定 benchmark 在相同初始状态下可重复得到一致结果和计数器值。

scaffold:
  files:
    - path: build.sbt
      content: |
        ThisBuild / scalaVersion := "2.13.18"
        ThisBuild / organization := "processoragent.demo"
        ThisBuild / version := "0.1.0-SNAPSHOT"

        val chiselVersion = "7.14.0"

        lazy val root = (project in file("."))
          .settings(
            name := "dual-issue-demo",
            addCompilerPlugin(
              "org.chipsalliance" % "chisel-plugin" % chiselVersion cross CrossVersion.full
            ),
            libraryDependencies ++= Seq(
              "org.chipsalliance" %% "chisel" % chiselVersion,
              "org.scalatest" %% "scalatest" % "3.2.19" % Test
            ),
            scalacOptions ++= Seq("-deprecation", "-feature", "-unchecked")
          )
    - path: project/build.properties
      content: |
        sbt.version=1.12.11
  smokeChecks:
    - id: sbt_compile
      description: 在 WSL 编译已批准的空 Chisel 项目骨架。
      runner: wsl
      script: cd {{projectWslPath}} && sbt -batch compile
      required: true
